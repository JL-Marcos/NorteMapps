<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Norte Maps v5</title>

  <!-- Libreria A-Frame: convierte las etiquetas <a-...> en objetos 3D -->
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>

  <!-- DATOS DEL MAPA: puntos, calles y territorio de Norte Maps, tal como vienen de Google My Maps
       (longitud y latitud en grados). Quedan guardados en window.NORTE_MAPS.
       Este archivo debe cargarse ANTES de los componentes, que lo usan. -->
  <script src="activos/norte-maps-datos.js"></script>

  <style>
    /* Ayuda: una pestana "? Ayuda" abajo a la izquierda que se despliega y se guarda (HTML normal, fuera de la escena 3D) */
    #hud { position: fixed; left: 12px; bottom: 12px; z-index: 10; font: 13px/1.4 system-ui, sans-serif; color: #222; }
    #hud-boton { display: block; font: 12px system-ui, sans-serif; padding: 6px 10px; border: 0; border-radius: 6px;
                 background: rgba(0,0,0,0.55); color: #fff; cursor: pointer; }
    #hud-cuerpo { display: none; margin-bottom: 6px; max-width: min(340px, 72vw); background: rgba(255,255,255,0.88);
                  padding: 8px 12px; border-radius: 6px; pointer-events: none; }
    #hud.abierto #hud-cuerpo { display: block; }
    /* Controles tactiles: solo aparecen en dispositivos tactiles (clase "tactil" en <body>) */
    #ctl-tactil { position: fixed; right: 12px; bottom: 76px; z-index: 10; display: none; flex-direction: column; gap: 10px; }
    body.tactil #ctl-tactil { display: flex; }
    body.tactil .rs-base { display: none !important; }   /* panel de estadisticas: oculto en telefono (en PC se ve) */
    .ctl-btn { width: 56px; height: 56px; border-radius: 50%; border: 0; background: rgba(0,0,0,0.55); color: #fff;
               font: 22px system-ui, sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
    .ctl-btn.activo { background: rgba(59,143,168,0.9); }
    #aviso { position: fixed; left: 50%; top: 56px; transform: translateX(-50%); z-index: 15; display: none; max-width: 80vw;
             background: rgba(30,120,60,0.95); color: #fff; padding: 10px 16px; border-radius: 8px; font: 14px system-ui, sans-serif; text-align: center; }
    @media (max-width: 520px) { #contador-recoleccion .txt-largo { display: none; } }
    @media (max-height: 480px) { #minimapa { width: 100px; height: 100px; } .ctl-btn { width: 50px; height: 50px; } }
  </style>

  <script>
    // ============================================================
    // COMPONENTES PROPIOS
    // Un componente es un comportamiento que se le pega a un objeto
    // escribiendo su nombre como atributo (ej: radio-audio="...").
    // ============================================================

    // ---------- 0) utilidades de recoleccion ----------
    // Dos estados por cassette, guardados en localStorage (persisten en ESTE navegador,
    // sin servidor ni cuenta de usuario -- fuera del alcance del prototipo):
    //   "llevando"    -> ya lo sacaste del mapa, lo llevas en la mano, pero AUN NO cuenta
    //                    para el contador/mural/rack (podes seguir explorando y juntar mas).
    //   "recolectado" -> lo depositaste en la radio: ahi si cuenta, se revela su fragmento
    //                    del mural, y queda disponible para reproducir desde el rack.
    var TOTAL_FRAGMENTOS = (window.NORTE_MAPS.puntos || []).filter(function (p) { return p.fragmento; }).length;
    function estaRecolectado(id) { return localStorage.getItem('norte-maps-recolectado-' + id) === '1'; }
    function estaLlevando(id) { return localStorage.getItem('norte-maps-llevando-' + id) === '1'; }
    function marcarLlevando(id) {
      localStorage.setItem('norte-maps-llevando-' + id, '1');
      window.dispatchEvent(new CustomEvent('norte-maps:llevando-cambio'));
    }
    function contarLlevando() {
      return (window.NORTE_MAPS.puntos || []).filter(function (p) { return p.fragmento && estaLlevando(p.fragmento); }).length;
    }
    // Deposita TODO lo que se esta llevando (se usa al hacer clic en la radio).
    function depositarTodo() {
      var items = (window.NORTE_MAPS.puntos || []).filter(function (p) { return p.fragmento && estaLlevando(p.fragmento); });
      if (!items.length) return false;
      items.forEach(function (p) {
        localStorage.removeItem('norte-maps-llevando-' + p.fragmento);
        localStorage.setItem('norte-maps-recolectado-' + p.fragmento, '1');
      });
      window.dispatchEvent(new CustomEvent('norte-maps:llevando-cambio'));
      window.dispatchEvent(new CustomEvent('norte-maps:recoleccion'));
      return true;
    }
    function contarRecolectados() {
      return (window.NORTE_MAPS.puntos || []).filter(function (p) { return p.fragmento && estaRecolectado(p.fragmento); }).length;
    }
    // La radio es el aparato, no algo que se "encuentre": su propio relato esta
    // siempre disponible desde el principio (no hay que recolectarlo).
    if (!estaRecolectado('radio')) { localStorage.setItem('norte-maps-recolectado-radio', '1'); }

    // ---------- 0b) dispositivo tactil y caminar con botones ----------
    // wasd-controls solo lee el teclado: en un telefono no hay como avanzar. Los botones de pantalla (▲ ▼ ⏩)
    // fijan AVANCE; el componente norte-maps lo lee en cada cuadro (tick) y mueve la camara hacia donde mira.
    var ES_TACTIL = window.matchMedia('(pointer: coarse)').matches || ('ontouchstart' in window) || new URLSearchParams(location.search).get('tactil') === '1';
    var AVANCE = { v: 0, rapido: false };

    // ---------- 0c) mision secundaria: basura ----------
    // 5 montones de basura (las X rojas del mapa). Se recogen con un clic (quedan "llevando", en una bolsa en la mano)
    // y se depositan en un contenedor verde (los tickets verdes del mapa). Con todo depositado se desbloquea el videoclip.
    var TOTAL_BASURA = (window.NORTE_MAPS.reciclaje || []).filter(function (r) { return r.tipo === 'basural'; }).length;
    var URL_VIDEOCLIP = 'https://www.youtube.com/embed/nb0cvkEZ2zg?start=567&autoplay=1&rel=0';   // NORTE FLOW, desde 9:27
    function basuraLlevada(i) { return localStorage.getItem('norte-maps-basura-llevando-' + i) === '1'; }
    function basuraDepositada(i) { return localStorage.getItem('norte-maps-basura-depositada-' + i) === '1'; }
    function contenedorUsado(j) { return localStorage.getItem('norte-maps-contenedor-usado-' + j) === '1'; }
    function contarBasuraLlevando() { var n = 0; for (var i = 0; i < TOTAL_BASURA; i++) if (basuraLlevada(i) && !basuraDepositada(i)) n++; return n; }
    function contarBasuraDepositada() { var n = 0; for (var i = 0; i < TOTAL_BASURA; i++) if (basuraDepositada(i)) n++; return n; }
    function mostrarAviso(texto) {
      var a = document.getElementById('aviso'); if (!a) return;
      a.textContent = texto; a.style.display = 'block';
      setTimeout(function () { a.style.display = 'none'; }, 7000);
    }
    function depositarBasura() {
      var antes = contarBasuraDepositada(), n = 0;
      for (var i = 0; i < TOTAL_BASURA; i++) {
        if (basuraLlevada(i) && !basuraDepositada(i)) {
          localStorage.removeItem('norte-maps-basura-llevando-' + i);
          localStorage.setItem('norte-maps-basura-depositada-' + i, '1'); n++;
        }
      }
      window.dispatchEvent(new CustomEvent('norte-maps:basura'));
      if (n && antes < TOTAL_BASURA && contarBasuraDepositada() === TOTAL_BASURA) {
        mostrarAviso('¡Barrio limpio! Se desbloqueó el videoclip de los niños: míralo en la pantalla de la cancha, detrás del gimnasio.');
      }
      return n;
    }
    function abrirVideoclip() {
      pausarOtrosAudios('');
      document.getElementById('iframe-documental').title = 'Videoclip NORTE FLOW';
      document.getElementById('iframe-documental').src = URL_VIDEOCLIP;
      document.getElementById('modal-documental').style.display = 'flex';
    }
    function actualizarVideoclip() {
      var b = document.getElementById('boton-videoclip');
      if (b) b.style.display = (TOTAL_BASURA > 0 && contarBasuraDepositada() === TOTAL_BASURA) ? 'block' : 'none';
    }

    function actualizarContador() {
      var el = document.getElementById('contador-recoleccion');
      if (el) el.innerHTML = '🎞️ ' + contarRecolectados() + ' / ' + TOTAL_FRAGMENTOS + '<span class="txt-largo"> relatos</span>' +
        (TOTAL_BASURA ? ' · 🗑️ ' + contarBasuraDepositada() + ' / ' + TOTAL_BASURA + '<span class="txt-largo"> basura</span>' : '');
    }
    function actualizarMano() {
      var n = contarLlevando();
      var mano = document.getElementById('mano-cassettes');
      if (mano) mano.setAttribute('visible', n > 0);
      var texto = document.getElementById('texto-mano');
      if (texto) texto.setAttribute('text', 'value', n > 0 ? ('x' + n) : '');
      var nb = contarBasuraLlevando();
      var bolsa = document.getElementById('mano-basura');
      if (bolsa) bolsa.setAttribute('visible', nb > 0);
      var textoB = document.getElementById('texto-basura');
      if (textoB) textoB.setAttribute('text', 'value', nb > 0 ? ('x' + nb) : '');
    }
    // Solo un audio suena a la vez (pausa cualquier otro que estuviera sonando).
    function pausarOtrosAudios(exceptoId) {
      document.querySelectorAll('audio[id^="audio-"]').forEach(function (a) {
        if (a.id !== exceptoId && !a.paused) a.pause();
      });
    }
    // "Apagar" un cassette ya recolectado: en vez de desaparecer del mapa (dejaba un
    // hueco raro), se queda ahi pero en gris y sin poder clickearlo de nuevo -- el mapa
    // sigue "encendido" (todo visible, da contexto), solo el icono ya usado se nota apagado.
    function apagarColeccionable(el) {
      el.querySelectorAll('.clickable').forEach(function (hijo) {
        hijo.classList.remove('clickable');
        hijo.removeAttribute('material');
        hijo.setAttribute('color', '#9C9C94');
      });
    }
    // Reinicio completo del prototipo: borra todo lo recolectado/llevado y recarga.
    function reiniciarExperiencia() {
      if (!confirm('¿Reiniciar la experiencia? Se borra todo lo recolectado en este navegador.')) return;
      Object.keys(localStorage).filter(function (k) { return k.indexOf('norte-maps-') === 0; })
        .forEach(function (k) { localStorage.removeItem(k); });
      location.reload();
    }
    window.addEventListener('load', function () {
      var btn = document.getElementById('boton-reiniciar');
      if (btn) btn.addEventListener('click', reiniciarExperiencia);
    });
    // Cuando algo nuevo se vuelve clickeable DESPUES de la carga inicial (ej. un
    // cajon del rack que se desbloquea), hay que avisarle al raycaster -- no detecta
    // solo los cambios de clase (ver nota de [[raycaster-clickable]] en el vault).
    function refrescarRaycaster() {
      var ray = document.querySelector('a-scene') && document.querySelector('a-scene').components.raycaster;
      if (ray) ray.refreshObjects();
    }
    window.addEventListener('norte-maps:recoleccion', actualizarContador);
    window.addEventListener('norte-maps:recoleccion', refrescarRaycaster);
    window.addEventListener('norte-maps:llevando-cambio', actualizarMano);
    window.addEventListener('norte-maps:basura', actualizarContador);
    window.addEventListener('norte-maps:basura', actualizarMano);
    window.addEventListener('norte-maps:basura', actualizarVideoclip);
    window.addEventListener('norte-maps:basura', refrescarRaycaster);
    window.addEventListener('load', actualizarVideoclip);
    window.addEventListener('load', function () {
      // controles tactiles
      if (ES_TACTIL) document.body.classList.add('tactil');
      [['ctl-avanzar', 1, false], ['ctl-rapido', 1, true], ['ctl-retroceder', -1, false]].forEach(function (c) {
        var b = document.getElementById(c[0]); if (!b) return;
        function soltar() { AVANCE.v = 0; AVANCE.rapido = false; b.classList.remove('activo'); }
        b.addEventListener('pointerdown', function (e) { e.preventDefault(); AVANCE.v = c[1]; AVANCE.rapido = c[2]; b.classList.add('activo'); });
        ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (ev) { b.addEventListener(ev, soltar); });
        b.addEventListener('contextmenu', function (e) { e.preventDefault(); });
      });
      // ayuda plegable: abierta en computador, cerrada en telefono
      var hud = document.getElementById('hud'), hb = document.getElementById('hud-boton');
      function pintarHb() { hb.textContent = hud.classList.contains('abierto') ? '✕ Ayuda' : '? Ayuda'; }
      if (!ES_TACTIL) hud.classList.add('abierto');
      pintarHb();
      hb.addEventListener('click', function () {
        hud.classList.toggle('abierto'); pintarHb();
        var m = document.getElementById('mapa').components['norte-maps']; if (m && hud.classList.contains('abierto')) m.escribirHud(null);
      });
      // videoclip
      var bv = document.getElementById('boton-videoclip');
      if (bv) bv.addEventListener('click', function () {
        pausarOtrosAudios('');
        document.getElementById('iframe-documental').title = 'Videoclip NORTE FLOW';
        document.getElementById('iframe-documental').src = URL_VIDEOCLIP;
        document.getElementById('modal-documental').style.display = 'flex';
      });
    });
    window.addEventListener('load', actualizarContador);
    window.addEventListener('load', actualizarMano);

    // ---------- 1) punto-audio ----------
    // Mecanica de "recoleccion": pasar el mouse por encima hace crecer LEVEMENTE el
    // objeto (y se mantiene mientras el cursor sigue encima); cada clic es un pulso
    // corto (baja de escala y vuelve), no un crecimiento acumulado. Al llegar al
    // numero de clics definido por punto (p.clics, segun el peso del audio), el
    // objeto se desprende y pasa a la mano del visitante (queda "llevando", no
    // "recolectado" todavia -- eso recien pasa al depositarlo en la radio).
    AFRAME.registerComponent('punto-audio', {
      schema: { src: { type: 'selector' }, clics: { type: 'number', default: 3 }, id: { type: 'string' } },
      init: function () {
        var el = this.el;
        var self = this;
        this.contador = 0;
        this.hovering = false;

        if (this.data.id && (estaRecolectado(this.data.id) || estaLlevando(this.data.id))) {
          apagarColeccionable(el);   // ya se saco antes: se queda ahi, pero apagado (gris, no clickeable)
          return;
        }
        // OJO: este componente se pega en un contenedor SIN geometria propia (ver [[raycaster-clickable]]
        // en el vault): la clase "clickable" tiene que ir en la geometria hija real (puesta por quien
        // crea el objeto), no aqui. Los eventos igual llegan aqui porque suben por el DOM (bubbling).

        function escalaBase() { return self.hovering ? 1.12 : 1; }

        // Sonidos posicionales (se oyen desde el cassette): un golpe corto en cada clic y una campana
        // al desprenderse. poolSize 3 permite clics seguidos sin que se corten entre si.
        el.setAttribute('sound__golpe', 'src: #snd-golpe; positional: true; poolSize: 3; volume: 1; refDistance: 1');
        el.setAttribute('sound__campana', 'src: #snd-campana; positional: true; poolSize: 1; volume: 1; refDistance: 1');
        function sonar(nombre) {
          var c = el.components['sound__' + nombre];
          if (c && c.loaded !== false) c.playSound();
        }

        el.addEventListener('mouseenter', function () {
          self.hovering = true;
          el.sceneEl.canvas.style.cursor = 'pointer';
          el.object3D.scale.setScalar(escalaBase());
        });
        el.addEventListener('mouseleave', function () {
          self.hovering = false;
          el.sceneEl.canvas.style.cursor = '';
          el.object3D.scale.setScalar(escalaBase());
        });
        el.addEventListener('click', function () {
          self.contador++;
          sonar(self.contador >= self.data.clics && self.data.id ? 'campana' : 'golpe');
          // pulso corto: baja de escala un instante y vuelve a la escala base (hover o normal)
          el.object3D.scale.setScalar(0.86);
          setTimeout(function () { el.object3D.scale.setScalar(escalaBase()); }, 90);

          if (self.contador >= self.data.clics && self.data.id) {
            marcarLlevando(self.data.id);
            apagarColeccionable(el);
          }
        });
      }
    });

    // ---------- 1b) portal ----------
    // Puerta clickeable que teletransporta la camara DENTRO DE LA MISMA ESCENA
    // (no carga otra pagina ni otro <a-scene>). Se usa para entrar/salir de los
    // interiores (CECOF, sala del gimnasio) sin romper la continuidad cartografica.
    AFRAME.registerComponent('portal', {
      schema: { destino: { type: 'vec3' }, mirara: { type: 'vec3' }, interior: { type: 'boolean', default: false } },
      init: function () {
        var el = this.el, data = this.data;
        el.classList.add('clickable');
        el.addEventListener('click', function () {
          var cam = document.querySelector('[camera]');
          if (!cam) return;
          cam.object3D.position.set(data.destino.x, data.destino.y, data.destino.z);
          if (data.mirara) {
            var dx = data.mirara.x - data.destino.x, dz = data.mirara.z - data.destino.z;
            cam.components['look-controls'].yawObject.rotation.y = Math.atan2(-dx, -dz);
          }
          // Las luces de A-Frame son globales (iluminan todo el mundo por igual). Dentro de una sala
          // se baja la luz general para que se note la luz FOCAL de esa sala; afuera se restaura.
          var amb = document.getElementById('luz-ambiente'), sol = document.getElementById('luz-sol');
          if (amb) amb.setAttribute('light', 'intensity', data.interior ? 0.3 : 0.9);
          if (sol) sol.setAttribute('light', 'intensity', data.interior ? 0 : 0.6);
        });
        el.addEventListener('mouseenter', function () { el.sceneEl.canvas.style.cursor = 'pointer'; });
        el.addEventListener('mouseleave', function () { el.sceneEl.canvas.style.cursor = ''; });
      }
    });

    // ---------- 2) mirar-camara ----------
    // Hace que un objeto (aqui, los carteles con nombre) gire siempre hacia quien mira,
    // pero solo de izquierda a derecha: el cartel queda vertical, no se inclina.
    AFRAME.registerComponent('mirar-camara', {
      init: function () {
        this.destino = new THREE.Vector3();   // donde esta la camara
      },
      tick: function () {
        var camara = this.el.sceneEl.camera;
        if (!camara) return;
        var obj = this.el.object3D;
        camara.getWorldPosition(this.destino);
        this.destino.y = obj.position.y;      // misma altura que el cartel -> no se inclina
        obj.lookAt(this.destino);
      }
    });

    // ---------- 3) correr ----------
    // Mantener Shift = caminar mas rapido (util para recorrer el mapa a escala real).
    // Funciona cambiando la "aceleracion" del componente wasd-controls.
    AFRAME.registerComponent('correr', {
      schema: { normal: { default: 15 }, rapido: { default: 60 } },
      init: function () {
        var el = this.el, d = this.data;
        function poner(valor) { el.setAttribute('wasd-controls', 'acceleration', valor); }
        window.addEventListener('keydown', function (e) { if (e.key === 'Shift') poner(d.rapido); });
        window.addEventListener('keyup', function (e) { if (e.key === 'Shift') poner(d.normal); });
        window.addEventListener('blur', function () { poner(d.normal); }); // si se pierde el foco, vuelve a normal
      }
    });

    // ---------- 4) norte-maps ----------
    // Construye el barrio a partir de los datos de window.NORTE_MAPS:
    //   - el suelo y el "territorio urbano" (el poligono del mapa)
    //   - las calles, como cintas sobre el suelo, con su nombre
    //   - los 12 puntos del mapa (gimnasio, radio, humedal...) con su cartel
    //   - los edificios en volumen: los reales (de OpenStreetMap) y casas de relleno inventadas
    //   - los puntos de reciclaje (cilindros chicos de colores)
    // El gimnasio queda en el centro del mundo (0, 0, 0).
    //
    // LA ESCALA: "escala: 0.2" significa 1 metro real = 0.2 metros en la escena (1:5).
    // Para ver el barrio a tamaño real hay dos formas:
    //   a) en la direccion del navegador agregar  ?escala=1   (ej: http://127.0.0.1:5500/index_v4.html?escala=1)
    //   b) en el HTML de mas abajo cambiar  norte-maps="escala: 0.2"  por  norte-maps="escala: 1"
    // Si hay ?escala= en la direccion, manda por sobre el numero escrito en el HTML.
    //
    // OTROS PARAMETROS DE LA DIRECCION (para probar sin editar el codigo):
    //   ?relleno=no   -> oculta las casas de relleno y deja solo los edificios reales de OpenStreetMap
    //   ?altura=2     -> exagera la altura de los edificios (2 = el doble). Util a escala 1:5, donde todo se ve bajito.
    AFRAME.registerComponent('norte-maps', {
      schema: { escala: { default: 0.2 } },

      init: function () {
        var el = this.el;
        var escena = el.sceneEl;
        var datos = window.NORTE_MAPS;
        if (!datos) { console.error('Falta activos/norte-maps-datos.js'); return; }

        // --- 1. Escala (del HTML, o de ?escala= en la direccion) ---
        var param = parseFloat(new URLSearchParams(location.search).get('escala'));
        var escala = param > 0 ? param : this.data.escala;
        this.escala = escala;
        var params = new URLSearchParams(location.search);
        var mostrarRelleno = params.get('relleno') !== 'no';
        var exagera = parseFloat(params.get('altura')) > 0 ? parseFloat(params.get('altura')) : 1;

        // --- 2. De grados (lon, lat) a metros de la escena ---
        // Un grado de latitud mide ~111 km (radio de la Tierra * pi/180).
        // Un grado de longitud mide menos cuanto mas lejos del ecuador: se multiplica por cos(latitud).
        // El origen (0,0) es el gimnasio. Este = +x. Norte = -z (en A-Frame "adelante" es -z).
        var RADIO_TIERRA = 6371000, RAD = Math.PI / 180;
        var origen = datos.origen, cosLat = Math.cos(origen.lat * RAD);
        function aEscena(lon, lat) {
          return new THREE.Vector2(
            (lon - origen.lon) * RAD * RADIO_TIERRA * cosLat * escala,   // x
            -(lat - origen.lat) * RAD * RADIO_TIERRA * escala             // z
          );
        }
        this.aEscena = aEscena;

        // --- 3. Ayudas ---
        // Crea un objeto de A-Frame (<a-...>) desde JavaScript y lo mete dentro de "padre".
        function crear(etiqueta, atributos, padre) {
          var e = document.createElement(etiqueta);
          for (var k in atributos) e.setAttribute(k, atributos[k]);
          (padre || el).appendChild(e);
          return e;
        }
        // Crea una malla 3D (geometria + material). "orden" decide quien se dibuja primero:
        // asi el suelo queda debajo del territorio y este debajo de las calles, sin parpadeos.
        function malla(geometria, color, orden) {
          var m = new THREE.Mesh(geometria, new THREE.MeshStandardMaterial({
            color: color, roughness: 1, side: THREE.DoubleSide, depthWrite: false
          }));
          m.renderOrder = orden;
          return m;
        }

        // --- 4. Niebla: mas cerca cuanto mas chico el mapa (con 0.2 es igual a la version anterior) ---
        escena.setAttribute('fog', 'type: linear; color: #ECECEC; near: ' + (125 * escala) + '; far: ' + (475 * escala));

        // --- 5. Suelo (un plano enorme) ---
        var lado = Math.max(500, 2600 * escala);
        var suelo = new THREE.PlaneGeometry(lado, lado);
        suelo.rotateX(-Math.PI / 2);                  // el plano nace vertical: se acuesta
        el.setObject3D('suelo', malla(suelo, '#E3DED0', -3));

        // --- 6. Territorio urbano: el poligono del mapa, de un verde claro ---
        // (se le quita el ultimo vertice porque repite el primero)
        var contorno = datos.territorio.slice(0, -1).map(function (p) {
          var q = aEscena(p[0], p[1]);
          return new THREE.Vector2(q.x, -q.y);        // ShapeGeometry usa (x, y); al acostarla, y pasa a ser -z
        });
        var territorio = new THREE.ShapeGeometry(new THREE.Shape(contorno));
        territorio.rotateX(-Math.PI / 2);
        el.setObject3D('territorio', malla(territorio, '#C2D9BC', -2));

        // --- 7. Calles: cada calle es una "cinta" (una tira) que sigue sus vertices ---
        var anchoCalle = 9 * escala;                  // ~9 m reales, en la escala elegida
        var pos = [], idx = [];                       // todas las calles se juntan en UNA sola malla (mas liviano)

        function agregarCinta(puntos, ancho) {
          var base = pos.length / 3;
          var n = puntos.length;
          for (var i = 0; i < n; i++) {
            // direccion del tramo anterior y del siguiente en este vertice
            var dPrev = i > 0 ? puntos[i].clone().sub(puntos[i - 1]).normalize() : null;
            var dSig = i < n - 1 ? puntos[i + 1].clone().sub(puntos[i]).normalize() : null;
            var dir = (dPrev && dSig) ? dPrev.clone().add(dSig).normalize() : (dPrev || dSig);
            var normal = new THREE.Vector2(-dir.y, dir.x);           // perpendicular a la direccion
            // en las esquinas se alarga un poco el borde para que la cinta no se "pince"
            var largo = ancho / 2;
            if (dPrev && dSig) {
              var nSeg = new THREE.Vector2(-dPrev.y, dPrev.x);
              largo = (ancho / 2) / Math.max(0.5, normal.dot(nSeg));
            }
            pos.push(puntos[i].x + normal.x * largo, 0, puntos[i].y + normal.y * largo);   // borde izquierdo
            pos.push(puntos[i].x - normal.x * largo, 0, puntos[i].y - normal.y * largo);   // borde derecho
          }
          for (var j = 0; j < n - 1; j++) {                          // cada tramo = 2 triangulos
            var a = base + j * 2;
            idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2);
          }
        }

        var etiquetasCalles = [];
        datos.calles.forEach(function (calle) {
          var puntos = calle.pts.map(function (p) { return aEscena(p[0], p[1]); });
          var esAvenida = calle.nombre.indexOf('Avenida') === 0;
          agregarCinta(puntos, esAvenida ? anchoCalle * 1.8 : anchoCalle);
          // buscamos el tramo mas largo para poner ahi el nombre
          var mejor = 0, mejorLargo = 0;
          for (var i = 0; i < puntos.length - 1; i++) {
            var L = puntos[i].distanceTo(puntos[i + 1]);
            if (L > mejorLargo) { mejorLargo = L; mejor = i; }
          }
          etiquetasCalles.push({ nombre: calle.nombre, a: puntos[mejor], b: puntos[mejor + 1], largo: mejorLargo });
        });

        var geoCalles = new THREE.BufferGeometry();
        geoCalles.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
        geoCalles.setIndex(idx);
        geoCalles.computeVertexNormals();
        el.setObject3D('calles', malla(geoCalles, '#7C7C78', -1));

        // --- 8. Nombres de las calles: texto acostado sobre el suelo, siguiendo la calle ---
        etiquetasCalles.forEach(function (c) {
          var dx = c.b.x - c.a.x, dz = c.b.y - c.a.y;
          // angulo de la calle visto desde arriba (al acostar el texto, su "arriba" apunta a -z)
          var angulo = Math.atan2(-dz, dx) * 180 / Math.PI;
          if (angulo > 90) angulo -= 180;             // para que el texto no quede "de cabeza"
          if (angulo < -90) angulo += 180;
          var ancho = Math.min(anchoCalle * 2.7, c.largo * 0.9);
          crear('a-entity', {
            text: 'value: ' + c.nombre + '; align: center; anchor: center; color: #F5F5F5; width: ' + ancho,
            position: ((c.a.x + c.b.x) / 2) + ' 0.05 ' + ((c.a.y + c.b.y) / 2),
            rotation: '-90 0 ' + angulo
          });
        });

        // --- VOLUMENES DE REFERENCIA (gimnasio y CECOF) ---
        // Formas medidas sobre las dos imagenes de referencia (mapa y detalle satelital, escala ~11 px/m,
        // calibrada con la distancia gimnasio-radio de los datos). Son rectangulos orientados 29,5 grados
        // (paralelos a la calle Antofagasta). Metros reales desde el gimnasio; +x este, +z sur.
        //   largo = lado hacia la calle (la PUERTA va en su cara frontal, hacia +u); ancho = el otro lado.
        // OJO: alturas ESTIMADAS (no medidas) y la profundidad del CECOF tambien: ajustar aqui.
        var VOLUMENES = {
          gimnasio: { cx: -5.9,  cz: -1.7, ang: 29.5, largo: 30.3, ancho: 22.1, alto: 6, color: '#CDBF9E' },
          cecof:    { cx: -11.3, cz: 16.7, ang: 29.5, largo: 22.0, ancho: 10.5, alto: 4, color: '#C9B68F' }
        };
        Object.keys(VOLUMENES).forEach(function (k) {
          var v = VOLUMENES[k], a = v.ang * Math.PI / 180;
          v.ux = Math.cos(a); v.uz = Math.sin(a);       // eje "hacia la calle"
          v.vx = -Math.sin(a); v.vz = Math.cos(a);      // eje perpendicular
        });
        // true si el punto (metros reales) cae dentro de algun volumen, ampliado en "margen" metros
        function dentroDeVolumen(x, z, margen) {
          return Object.keys(VOLUMENES).some(function (k) {
            var v = VOLUMENES[k], dx = x - v.cx, dz = z - v.cz;
            return Math.abs(dx * v.ux + dz * v.uz) < v.largo / 2 + margen && Math.abs(dx * v.vx + dz * v.vz) < v.ancho / 2 + margen;
          });
        }

        // --- 8b. Edificios en volumen ---
        // Cada edificio es un poligono (su contorno, en grados) que se "extruye": se levanta hasta su altura.
        // Todos se juntan en UNA sola malla. Cada edificio tiene:
        //   - un techo: el poligono dividido en triangulos (ShapeUtils.triangulateShape)
        //   - paredes: un rectangulo por cada lado del contorno
        // La altura en la escena = altura real * escala * exageracion (la de ?altura=).
        var posE = [], colE = [], idxE = [];
        var colorReal = new THREE.Color('#F6E7C8'), colorRelleno = new THREE.Color('#E6E2D8');
        var nReal = 0, nRelleno = 0;
        // Colores de casa (paletas inspiradas en las fotos del barrio: madera, pintura lisa, techos de zinc). El color de
        // cada edificio se elige "al azar" pero repetible (depende de su numero), asi no cambia entre cargas.
        var PAREDES = ['#B98A5E', '#8C5A3C', '#E4E0D4', '#C86B5C', '#D9B95A', '#7F9DB5', '#8DAA8A', '#C9A0A8', '#A9A396', '#6F8FA8', '#9C7A5A'];
        var TECHOS = ['#7C7F82', '#8C4A3E', '#5E6B5A', '#4F5A66', '#9A9690'];
        function rngK(k) { var s = ((k + 1) * 2654435761) % 2147483647 || 1; return function () { s = (s * 16807) % 2147483647; return s / 2147483647; }; }
        // segmentos de calle (unidades de escena) para saber hacia donde mira cada casa
        var segsCalles = [];
        datos.calles.forEach(function (c) {
          var pp = c.pts.map(function (q) { return aEscena(q[0], q[1]); });
          for (var i = 0; i < pp.length - 1; i++) segsCalles.push([pp[i].x, pp[i].y, pp[i + 1].x, pp[i + 1].y]);
        });
        // un rectangulo vertical pegado a una pared (ventana o puerta): centro (cx,cz), eje u a lo largo de la pared, normal n hacia afuera
        function cuadroPared(cx, cz, ux, uz, nx, nz, ancho, y0, y1, color) {
          var off = 0.05 * escala, hw = ancho / 2, v = posE.length / 3, col = new THREE.Color(color);
          var xs = [cx - ux * hw, cx + ux * hw, cx + ux * hw, cx - ux * hw], zs = [cz - uz * hw, cz + uz * hw, cz + uz * hw, cz - uz * hw], ys = [y0, y0, y1, y1];
          for (var i = 0; i < 4; i++) { posE.push(xs[i] + nx * off, ys[i], zs[i] + nz * off); colE.push(col.r, col.g, col.b); }
          idxE.push(v, v + 1, v + 2, v, v + 2, v + 3);
        }
        var colisionesEdificios = [];   // circulo (centro+radio) por edificio, para no poder atravesarlo caminando
        this.colisionesEdificios = colisionesEdificios;
        (datos.edificios || []).forEach(function (e, k) {
          if (!e.real && !mostrarRelleno) return;
          var contorno = e.pts.map(function (p) { return aEscena(p[0], p[1]); });
          var alto = e.alto * escala * exagera;
          // La huella de OpenStreetMap que contiene al gimnasio y al CECOF (un solo poligono grande) se
          // omite: la reemplazan los dos volumenes de referencia de abajo (VOLUMENES), con su puerta afuera.
          //   - la huella OSM n.o 15 coincide con el gimnasio de la imagen: se omite (la reemplaza el volumen);
          //   - las casas de relleno que pisan un volumen tambien se omiten.
          var cxm = 0, czm = 0;
          contorno.forEach(function (pp) { cxm += pp.x / escala; czm += pp.y / escala; });
          cxm /= contorno.length; czm /= contorno.length;
          if (dentroDeVolumen(cxm, czm, 1)) return;
          if (!e.real && contorno.some(function (pp) { return dentroDeVolumen(pp.x / escala, pp.y / escala, 0.5); })) return;
          // Colision contra TODOS los edificios (reales Y de relleno -- las casas de relleno
          // tambien tienen que sentirse solidas, no son solo decoracion). El "arrastre" raro
          // que daba esto antes no era por incluir relleno: era por 1) resolver varios
          // circulos superpuestos en el mismo cuadro (ver resolverColisiones mas abajo,
          // ya arreglado: resuelve solo el de mayor penetracion por cuadro) y 2) un edificio
          // real con poligono irregular que daba un circulo gigante (ver el tope de abajo).
          var cx = 0, cz = 0;
          contorno.forEach(function (p) { cx += p.x; cz += p.y; });
          cx /= contorno.length; cz /= contorno.length;
          var radioEdif = 0;
          contorno.forEach(function (p) { radioEdif = Math.max(radioEdif, Math.hypot(p.x - cx, p.y - cz)); });
          // Tope de 6 m reales: algun edificio del dataset (probablemente una manzana completa
          // u otro poligono irregular) daba un circulo de colision gigante (~23 m de radio) que
          // tapaba toda la zona del gimnasio/CECOF. Un circulo de 6 m es de sobra para una casa
          // o edificio comun y evita esos casos raros.
          radioEdif = Math.min(radioEdif, 6 * escala);
          colisionesEdificios.push({ x: cx, z: cz, radio: radioEdif + 0.3 * escala });
          // un poco de variacion de tono entre un edificio y otro (sin azar real: depende del numero de edificio)
          var rk = rngK(k);
          var pared = new THREE.Color(PAREDES[Math.floor(rk() * PAREDES.length)]);
          pared.offsetHSL((rk() - 0.5) * 0.02, (rk() - 0.5) * 0.08, (rk() - 0.5) * 0.08);
          var techo = new THREE.Color(TECHOS[Math.floor(rk() * TECHOS.length)]);
          techo.offsetHSL(0, 0, (rk() - 0.5) * 0.06);
          if (e.real) nReal++; else nRelleno++;

          // techo
          var base = posE.length / 3;
          contorno.forEach(function (p) { posE.push(p.x, alto, p.y); colE.push(techo.r, techo.g, techo.b); });
          THREE.ShapeUtils.triangulateShape(contorno.slice(), []).forEach(function (t) {
            idxE.push(base + t[0], base + t[1], base + t[2]);
          });
          // paredes
          for (var i = 0; i < contorno.length; i++) {
            var a = contorno[i], b = contorno[(i + 1) % contorno.length];
            var v = posE.length / 3;
            posE.push(a.x, 0, a.y, b.x, 0, b.y, b.x, alto, b.y, a.x, alto, a.y);
            for (var c = 0; c < 4; c++) colE.push(pared.r, pared.g, pared.b);
            idxE.push(v, v + 1, v + 2, v, v + 2, v + 3);
          }
          // ventanas y puerta en la pared que mira a la calle mas cercana
          if (contorno.length >= 3 && segsCalles.length) {
            var area2 = 0;
            for (var q1 = 0; q1 < contorno.length; q1++) { var pa = contorno[q1], pb = contorno[(q1 + 1) % contorno.length]; area2 += pa.x * pb.y - pb.x * pa.y; }
            var signo = area2 > 0 ? 1 : -1;
            var mejorD = Infinity, cxC = 0, czC = 0;
            for (var s1 = 0; s1 < segsCalles.length; s1++) {
              var sg = segsCalles[s1], sx = sg[2] - sg[0], sz = sg[3] - sg[1], l2 = sx * sx + sz * sz;
              var tt = l2 ? Math.max(0, Math.min(1, ((cx - sg[0]) * sx + (cz - sg[1]) * sz) / l2)) : 0;
              var qx = sg[0] + tt * sx, qz = sg[1] + tt * sz, dd = Math.hypot(cx - qx, cz - qz);
              if (dd < mejorD) { mejorD = dd; cxC = qx; czC = qz; }
            }
            if (mejorD > 0.001 && mejorD < 60 * escala) {
              var dcx = (cxC - cx) / mejorD, dcz = (czC - cz) / mejorD, mejorE = -1, mejorDot = 0.2;
              for (var e1 = 0; e1 < contorno.length; e1++) {
                var ea = contorno[e1], eb = contorno[(e1 + 1) % contorno.length], ex = eb.x - ea.x, ez = eb.y - ea.y, eL = Math.hypot(ex, ez);
                if (eL < 3 * escala) continue;
                var dot = (signo * ez / eL) * dcx + (-signo * ex / eL) * dcz;   // normal hacia afuera . direccion a la calle
                if (dot > mejorDot) { mejorDot = dot; mejorE = e1; }
              }
              if (mejorE >= 0) {
                var wa = contorno[mejorE], wb = contorno[(mejorE + 1) % contorno.length], wx = wb.x - wa.x, wz = wb.y - wa.y, wL = Math.hypot(wx, wz);
                var ux = wx / wL, uz = wz / wL, nx = signo * uz, nz = -signo * ux;
                var ranuras = Math.max(2, Math.min(5, Math.floor(wL / escala / 2.2))), puertaR = Math.floor(rk() * ranuras);
                var altoV = alto / escala;   // alto real del edificio, en metros
                for (var j = 0; j < ranuras; j++) {
                  var tj = (j + 0.5) / ranuras, pxj = wa.x + wx * tj, pzj = wa.y + wz * tj;
                  if (j === puertaR) cuadroPared(pxj, pzj, ux, uz, nx, nz, 0.9 * escala, 0, Math.min(2.0, altoV * 0.7) * escala, '#5B3F2B');
                  else cuadroPared(pxj, pzj, ux, uz, nx, nz, 1.0 * escala, 0.9 * escala, Math.min(1.9, altoV * 0.75) * escala, rk() < 0.3 ? '#4A5E70' : '#2E3B47');
                }
              }
            }
          }
        });
        this.nReal = nReal;
        this.nRelleno = nRelleno;
        if (posE.length) {
          var geoE = new THREE.BufferGeometry();
          geoE.setAttribute('position', new THREE.Float32BufferAttribute(posE, 3));
          geoE.setAttribute('color', new THREE.Float32BufferAttribute(colE, 3));
          geoE.setIndex(idxE);
          // flatShading: cada cara se ilumina por separado (se ve "maqueta" y no hacen falta normales)
          el.setObject3D('edificios', new THREE.Mesh(geoE, new THREE.MeshStandardMaterial({
            vertexColors: true, flatShading: true, roughness: 1, side: THREE.DoubleSide
          })));
        }

        // --- 9. INTERIORES: el CECOF (con la radio adentro) y la sala del gimnasio (con el mural).
        // Se ubican lejos del barrio para no superponerse visualmente; se entra y sale por una
        // puerta clickeable (componente "portal") que mueve la camara DENTRO de la misma escena,
        // sin cambiar de pagina: la cartografia no se corta.
        var SALA_CECOF = new THREE.Vector3(300, 0, 0);
        var SALA_GIMNASIO = new THREE.Vector3(300, 0, 60);
        var salasColision = [];    // rectangulos interiores: la camara no puede salir de las paredes
        var cajasColision = [];    // volumenes exteriores: la camara no puede entrar
        this.salas = salasColision;
        this.cajas = cajasColision;
        // Posicion de cada fragmento del mural dentro de la imagen completa (u,v de 0 a 1,
        // 0,0 = esquina superior izquierda de la foto real), para que el fragmento aparezca
        // en la sala EXACTAMENTE donde esta ese icono en el mural fisico.
        var FRAGMENTOS_UV = {
          gimnasio: [0.459, 0.568], radio: [0.415, 0.534], cecof: [0.421, 0.579],
          huerta: [0.376, 0.514], 'perritos-a': [0.370, 0.656], 'perritos-b': [0.567, 0.651],
          'comida-rapida': [0.591, 0.733], cancha: [0.629, 0.683], locomocion: [0.747, 0.616]
        };

        // OJO ESCALA: "ancho"/"alto" llegan ya en metros reales (sin multiplicar por "escala").
        // Esta funcion los escala ella misma -- asi construirCaja(8,4,...) siempre significa
        // "8x4 metros reales", sea cual sea la escala elegida (antes quedaban fijos y
        // desproporcionados en relacion al barrio achicado: el bug que hacia "ver raro el mapa").
        function construirCaja(anchoReal, altoReal, padre, centro) {
          var ancho = anchoReal * escala, alto = altoReal * escala;
          var grosor = 0.15 * escala;
          var pared = { color: '#EDE9DD', roughness: 1 };
          crear('a-plane', { width: ancho, height: ancho, rotation: '-90 0 0', color: '#D8D2C2' }, padre);
          crear('a-box', { width: ancho + grosor, height: alto, depth: grosor, position: '0 ' + (alto / 2) + ' ' + (-ancho / 2), color: pared.color }, padre);   // fondo
          crear('a-box', { width: ancho + grosor, height: alto, depth: grosor, position: '0 ' + (alto / 2) + ' ' + (ancho / 2), color: pared.color }, padre);    // frente (con la puerta)
          crear('a-box', { width: grosor, height: alto, depth: ancho, position: (-ancho / 2) + ' ' + (alto / 2) + ' 0', color: pared.color }, padre);
          crear('a-box', { width: grosor, height: alto, depth: ancho, position: (ancho / 2) + ' ' + (alto / 2) + ' 0', color: pared.color }, padre);
          crear('a-plane', { width: ancho, height: ancho, rotation: '90 0 0', position: '0 ' + alto + ' 0', color: '#E4DFD0' }, padre);   // techo: la sala queda cerrada
          // la luz de cada sala es FOCAL (spot), la pone cada sala; ya no hay luz puntual central.
          // la camara se queda dentro de las paredes (margen mayor al plano cercano de la camara)
          if (centro) salasColision.push({ x: centro.x, z: centro.z, half: ancho / 2 - grosor - 0.1, fuera: ancho * 1.5 });
          // se devuelve tambien "grosor": cualquier cosa que se cuelgue de una pared (mural,
          // pantalla, rack) tiene que quedar DELANTE de ella, no en su linea central -- si no,
          // queda dentro del espesor de la pared y la tapa el propio muro (invisible).
          return { ancho: ancho, alto: alto, grosor: grosor };
        }

        function construirSalaCecof(salida, radioData) {
          var sala = crear('a-entity', { position: SALA_CECOF.x + ' ' + SALA_CECOF.y + ' ' + SALA_CECOF.z });
          var dim = construirCaja(8, 4, sala, SALA_CECOF);   // 8x4 METROS REALES -- construirCaja aplica la escala

          // La radio: es el APARATO, no un cassette para recolectar. Su propio relato
          // esta siempre disponible. Un clic con las manos vacias lo reproduce/pausa;
          // un clic LLEVANDO cassettes los deposita a todos de una vez (quedan en el
          // rack de la pared, listos para reproducirse).
          if (radioData) {
            var marcaRadio = crear('a-entity', { position: '0 0 ' + (-1 * escala) }, sala);
            crear('a-box', { width: 0.6 * escala, height: 1 * escala, depth: 0.5 * escala, position: '0 ' + (0.5 * escala) + ' 0', color: '#9C7A54' }, marcaRadio);
            var modeloRadio = crear('a-entity', { 'gltf-model': '#radio', position: '0 ' + (1 * escala) + ' 0', scale: (2 * escala) + ' ' + (2 * escala) + ' ' + (2 * escala), class: 'clickable' }, marcaRadio);
            modeloRadio.addEventListener('mouseenter', function () { modeloRadio.sceneEl.canvas.style.cursor = 'pointer'; modeloRadio.object3D.scale.setScalar(2.2 * escala); });
            modeloRadio.addEventListener('mouseleave', function () { modeloRadio.sceneEl.canvas.style.cursor = ''; modeloRadio.object3D.scale.setScalar(2 * escala); });
            modeloRadio.addEventListener('click', function () {
              if (contarLlevando() > 0) { depositarTodo(); return; }
              var audioRadio = document.getElementById('audio-' + radioData.audio);
              if (!audioRadio) return;
              if (audioRadio.paused) { pausarOtrosAudios(audioRadio.id); audioRadio.play().catch(function (e) { console.warn(e); }); }
              else { audioRadio.pause(); }
            });
          }

          // El rack: EN LA PARED izquierda (no sobre una mesa), un cassette "ranura" por
          // cada relato que se encuentra afuera (todos menos la radio), con su nombre
          // debajo en letra chica. Gris y bloqueado hasta depositarlo; celeste y
          // clickeable despues -- clic para reproducir (pausa cualquier otro audio).
          var otrosFragmentos = datos.puntos.filter(function (p) { return p.fragmento && p.fragmento !== 'radio'; });
          var xPared = -dim.ancho / 2 + dim.grosor + 0.02 * escala;      // DELANTE de la pared izquierda (no dentro)
          var zBase = -1.3 * escala, pasoZ = 0.9 * escala, pasoY = -0.7 * escala, yBase = dim.alto * 0.62;
          otrosFragmentos.forEach(function (p, i) {
            var col = i % 4, fila = Math.floor(i / 4);
            var z = zBase + col * pasoZ, y = yBase + fila * pasoY;
            var ranura = crear('a-entity', { position: xPared + ' ' + y + ' ' + z, rotation: '0 90 0' }, sala);
            var caja = crear('a-box', { width: 0.1 * escala, height: 0.16 * escala, depth: 0.03 * escala, color: '#6B6B66' }, ranura);
            crear('a-entity', {
              text: 'value: ' + p.nombre + '; align: center; color: #555; width: ' + (1.6 * escala),
              position: '0 ' + (-0.13 * escala) + ' ' + (0.02 * escala)
            }, ranura);
            function refrescarRanura() {
              var listo = estaRecolectado(p.fragmento);
              caja.setAttribute('color', listo ? '#3B8FA8' : '#6B6B66');
              if (listo) caja.classList.add('clickable'); else caja.classList.remove('clickable');
            }
            refrescarRanura();
            caja.addEventListener('mouseenter', function () {
              if (!estaRecolectado(p.fragmento)) return;
              caja.sceneEl.canvas.style.cursor = 'pointer'; caja.object3D.scale.setScalar(1.18);
            });
            caja.addEventListener('mouseleave', function () { caja.object3D.scale.setScalar(1); caja.sceneEl.canvas.style.cursor = ''; });
            caja.addEventListener('click', function () {
              if (!estaRecolectado(p.fragmento)) return;
              var a = document.getElementById('audio-' + p.audio);
              if (!a) return;
              if (a.paused) { pausarOtrosAudios(a.id); a.currentTime = 0; a.play().catch(function (e) { console.warn(e); }); }
              else { a.pause(); }
            });
            window.addEventListener('norte-maps:recoleccion', refrescarRanura);
          });

          // LUCES FOCALES del CECOF: una sobre la radio y otra sobre la pared del rack.
          crear('a-entity', { id: 'objetivo-radio', position: '0 ' + (1 * escala) + ' ' + (-1 * escala) }, sala);
          crear('a-entity', {
            light: 'type: spot; color: #FFE2B0; intensity: 2.5; angle: 24; penumbra: 0.5; decay: 1; distance: ' + (10 * escala) + '; target: #objetivo-radio',
            position: (1.4 * escala) + ' ' + (3.7 * escala) + ' ' + (1.3 * escala)
          }, sala);
          crear('a-entity', { id: 'objetivo-rack', position: xPared + ' ' + (yBase - 0.35 * escala) + ' ' + (zBase + 1.5 * pasoZ) }, sala);
          crear('a-entity', {
            light: 'type: spot; color: #FFFFFF; intensity: 2.2; angle: 30; penumbra: 0.5; decay: 1; distance: ' + (10 * escala) + '; target: #objetivo-rack',
            position: (1.8 * escala) + ' ' + (3.7 * escala) + ' ' + (0.2 * escala)
          }, sala);

          // La puerta va pegada al muro del frente, por dentro. Al volver afuera, la altura de ojo
          // vuelve a la de la escala exterior (1.6*escala) y se aparece delante de la puerta exterior.
          var puerta = crear('a-box', { width: 1 * escala, height: 2 * escala, depth: 0.1 * escala, position: '0 ' + escala + ' ' + (dim.ancho / 2 - dim.grosor), color: '#8C6A46' }, sala);
          puerta.setAttribute('portal', 'destino: ' + salida.x + ' ' + (1.6 * escala) + ' ' + salida.z + '; mirara: ' + salida.mirX + ' ' + (1.6 * escala) + ' ' + salida.mirZ + '; interior: false');
        }

        function construirSalaGimnasio(salida) {
          var sala = crear('a-entity', { position: SALA_GIMNASIO.x + ' ' + SALA_GIMNASIO.y + ' ' + SALA_GIMNASIO.z });
          var dim = construirCaja(9, 5, sala, SALA_GIMNASIO);   // 9x5 METROS REALES -- construirCaja aplica la escala
          // OJO: con el ancho real de la foto (1600x1066 px), un mural de 8 m de ancho da
          // 5.33 m de alto -- MAS ALTO que el techo de 5 m de esta sala (quedaba cortado
          // contra el techo). 6 m de ancho da 4 m de alto, con margen de sobra.
          var murWreal = 6, murW = murWreal * escala, murH = murW * 1066 / 1600;
          var zMural = -dim.ancho / 2 + dim.grosor + 0.02 * escala;   // DELANTE de la pared de atras (no dentro)
          crear('a-plane', {
            width: murW, height: murH, position: '0 ' + (murH / 2 + 0.3 * escala) + ' ' + zMural,
            material: 'src: #mural-completo; roughness: 1; metalness: 0'
          }, sala);
          // PUNTITOS DE LUZ VERDE: uno bajo la posicion de cada fragmento del mural. Apagado (gris oscuro)
          // hasta que ese cassette queda depositado en la radio; entonces se enciende verde.
          var puntitos = {};
          Object.keys(FRAGMENTOS_UV).forEach(function (clave) {
            var uv = FRAGMENTOS_UV[clave];
            var x = (uv[0] - 0.5) * murW;
            var y = (murH / 2 + 0.3 * escala) + (0.5 - uv[1]) * murH - 0.55 * escala;
            puntitos[clave] = crear('a-sphere', {
              radius: 0.07 * escala, 'segments-width': 10, 'segments-height': 8,
              position: x + ' ' + y + ' ' + (zMural + 0.05 * escala)
            }, sala);
          });
          function refrescarPuntitos() {
            Object.keys(puntitos).forEach(function (clave) {
              puntitos[clave].setAttribute('material', estaRecolectado(clave)
                ? 'color: #2BE05A; emissive: #2BE05A; emissiveIntensity: 1.4'
                : 'color: #2A2A2A; emissive: #000000');
            });
          }
          refrescarPuntitos();
          window.addEventListener('norte-maps:recoleccion', refrescarPuntitos);

          // LUZ FOCAL del gimnasio: un foco sobre el mural (la imagen queda iluminada).
          crear('a-entity', { id: 'objetivo-mural', position: '0 ' + (murH / 2 + 0.3 * escala) + ' ' + zMural }, sala);
          crear('a-entity', {
            light: 'type: spot; color: #FFF1D6; intensity: 3; angle: 42; penumbra: 0.4; decay: 1; distance: ' + (12 * escala) + '; target: #objetivo-mural',
            position: '0 ' + (dim.alto - 0.25 * escala) + ' ' + (0.5 * escala)
          }, sala);

          // El "cine": pantalla + proyector en la pared lateral izquierda. Queda
          // bloqueada (gris, sin clic) hasta reunir los 9 relatos en el mural/rack;
          // al completarse, se desbloquea y un clic reproduce el documental (antes
          // esto era un boton flotante fuera de la escena -- ahora vive adentro, sin
          // texto explicativo: el color apagado/encendido ya comunica el estado).
          var xPared = -dim.ancho / 2 + dim.grosor + 0.02 * escala;   // DELANTE de la pared lateral (no dentro)
          var pantalla = crear('a-plane', {
            width: 2.6 * escala, height: 1.5 * escala, position: xPared + ' ' + (1.8 * escala) + ' ' + (dim.ancho * 0.3), rotation: '0 90 0', color: '#1A1A1A'
          }, sala);
          crear('a-box', { width: 0.3 * escala, height: 0.2 * escala, depth: 0.4 * escala, position: (-xPared) + ' ' + (2.6 * escala) + ' ' + (dim.ancho * 0.3), rotation: '0 90 0', color: '#444' }, sala);
          function refrescarPantalla() {
            var listo = contarRecolectados() === TOTAL_FRAGMENTOS;
            pantalla.setAttribute('color', listo ? '#000' : '#1A1A1A');
            if (listo) pantalla.classList.add('clickable'); else pantalla.classList.remove('clickable');
          }
          refrescarPantalla();
          pantalla.addEventListener('mouseenter', function () { if (contarRecolectados() === TOTAL_FRAGMENTOS) pantalla.sceneEl.canvas.style.cursor = 'pointer'; });
          pantalla.addEventListener('mouseleave', function () { pantalla.sceneEl.canvas.style.cursor = ''; });
          pantalla.addEventListener('click', function () {
            if (contarRecolectados() !== TOTAL_FRAGMENTOS) return;
            document.getElementById('iframe-documental').src = 'https://www.youtube.com/embed/S1ep6XOCqaQ?autoplay=1';
            document.getElementById('modal-documental').style.display = 'flex';
          });
          window.addEventListener('norte-maps:recoleccion', refrescarPantalla);

          var puerta = crear('a-box', { width: 1 * escala, height: 2 * escala, depth: 0.1 * escala, position: '0 ' + escala + ' ' + (dim.ancho / 2 - dim.grosor), color: '#8C6A46' }, sala);
          puerta.setAttribute('portal', 'destino: ' + salida.x + ' ' + (1.6 * escala) + ' ' + salida.z + '; mirara: ' + salida.mirX + ' ' + (1.6 * escala) + ' ' + salida.mirZ + '; interior: false');
        }

        // --- 10. Los puntos del mapa exterior ---
        var camaraInicio = null;                       // donde parte el visitante (se calcula abajo)
        var radioData = datos.puntos.find(function (p) { return p.tipo === 'radio'; });
        var colisiones = [];   // circulos (centro+radio, en unidades de escena) contra los que choca la camara
        this.colisiones = colisiones;
        datos.puntos.forEach(function (p) {
          if (p.tipo === 'radio') return;   // la radio ya no va afuera: vive dentro del CECOF
          var q = aEscena(p.lon, p.lat);
          var marca = crear('a-entity', { position: q.x + ' 0 ' + q.y });
          var altoCartel = 3.4 * escala;
          var esCecof = p.nombre === 'cecof';
          var offCartel = { x: 0, z: 0 };   // si el cassette se desplaza (ver mas abajo), el cartel lo sigue

          // GIMNASIO y CECOF tienen un VOLUMEN de referencia (ver VOLUMENES) con la puerta POR FUERA de
          // su cara hacia la calle y el cassette delante de la puerta. Los demas puntos no cambian.
          var vol = VOLUMENES[p.nombre];
          var offColeccionable = { x: 0, z: 0 };
          if (vol) {   // 1,6 m delante de la cara frontal, sobre el eje de la puerta (relativo al punto del mapa)
            var fr = vol.largo / 2 + 1.6;
            offColeccionable = { x: (vol.cx + fr * vol.ux) * escala - q.x, z: (vol.cz + fr * vol.uz) * escala - q.y };
          }
          offCartel = offColeccionable;
          var coleccionable = crear('a-entity', { position: offColeccionable.x + ' 0 ' + offColeccionable.z }, marca);
          if (p.audio) {
            // una mesita BAJA (0.22 m reales) con el cassette encima (altura de ojo = 1.6*escala).
            crear('a-box', { width: 0.4 * escala, height: 0.22 * escala, depth: 0.4 * escala, position: '0 ' + (0.11 * escala) + ' 0', color: '#9C7A54' }, coleccionable);
            var cassette = crear('a-entity', { position: '0 ' + (0.24 * escala) + ' 0' }, coleccionable);
            // la clase "clickable" va en la geometria del cassette (no en la mesita ni en "coleccionable")
            crear('a-box', { width: 0.18 * escala, height: 0.03 * escala, depth: 0.11 * escala, color: '#3B8FA8', class: 'clickable' }, cassette);
            crear('a-cylinder', { radius: 0.028 * escala, height: 0.034 * escala, position: (-0.045 * escala) + ' ' + (0.02 * escala) + ' 0', color: '#222', 'segments-radial': 10, class: 'clickable' }, cassette);
            crear('a-cylinder', { radius: 0.028 * escala, height: 0.034 * escala, position: (0.045 * escala) + ' ' + (0.02 * escala) + ' 0', color: '#222', 'segments-radial': 10, class: 'clickable' }, cassette);
            altoCartel = 0.65 * escala;
          } else {
            crear('a-cylinder', { radius: 0.06 * escala, height: 2.4 * escala, position: '0 ' + (1.2 * escala) + ' 0', color: '#444444', 'segments-radial': 6, 'segments-height': 1 }, coleccionable);
            crear('a-sphere', {
              radius: 0.28 * escala, position: '0 ' + (2.5 * escala) + ' 0', color: '#E8743B', 'segments-width': 12, 'segments-height': 8,
              material: 'color: #E8743B; emissive: #E8743B; emissiveIntensity: 0.4'
            }, coleccionable);
          }
          if (p.audio) {
            coleccionable.setAttribute('punto-audio', 'clics: ' + (p.clics || 3) + '; id: ' + p.fragmento);
          }
          // La altura del ojo tambien se escala (1.6 m reales * escala).
          if (p.tipo === 'gimnasio') camaraInicio = new THREE.Vector3(q.x, 1.6 * escala, q.y + 32 * escala);

          if (vol) {
            var hx = vol.largo / 2 * escala, hz = vol.ancho / 2 * escala, vh = vol.alto * escala;
            var cxs = vol.cx * escala, czs = vol.cz * escala;
            // entidad girada: su eje local +x apunta hacia la calle (en A-Frame, girar -ang en Y)
            var volEl = crear('a-entity', { position: cxs + ' 0 ' + czs, rotation: '0 ' + (-vol.ang) + ' 0' });
            crear('a-box', { width: 2 * hx, height: vh, depth: 2 * hz, position: '0 ' + (vh / 2) + ' 0', material: 'color: ' + vol.color + '; roughness: 1' }, volEl);
            cajasColision.push({ cx: cxs, cz: czs, ux: vol.ux, uz: vol.uz, vx: vol.vx, vz: vol.vz, hx: hx, hz: hz });
            // la puerta, POR FUERA de la cara frontal (apenas despegada del muro)
            var puertaExt = crear('a-box', {
              width: 0.12 * escala, height: 2 * escala, depth: 1 * escala,
              position: (hx + 0.06 * escala) + ' ' + escala + ' 0', color: '#8C6A46', class: 'clickable'
            }, volEl);
            // al salir se aparece 2,6 m delante de la puerta, mirando hacia ella
            var d1 = vol.largo / 2 + 2.6, d0 = vol.largo / 2;
            var salida = { x: (vol.cx + d1 * vol.ux) * escala, z: (vol.cz + d1 * vol.uz) * escala,
                           mirX: (vol.cx + d0 * vol.ux) * escala, mirZ: (vol.cz + d0 * vol.uz) * escala };
            var sala = p.tipo === 'gimnasio' ? SALA_GIMNASIO : SALA_CECOF;
            puertaExt.setAttribute('portal', 'destino: ' + sala.x + ' ' + (1.6 * escala) + ' ' + (sala.z + 3 * escala) + '; mirara: ' + sala.x + ' ' + (1.6 * escala) + ' ' + sala.z + '; interior: true');
            if (p.tipo === 'gimnasio') construirSalaGimnasio(salida); else construirSalaCecof(salida, radioData);
          }

          // cartel con el nombre (siempre mirando al visitante, sin instrucciones -- el
          // hover/pulso ya comunica que se puede interactuar). Sigue al cassette si este
          // se desplazo (gimnasio/CECOF, ver offCartel mas arriba).
          crear('a-entity', {
            text: 'value: ' + p.nombre + '; align: center; anchor: center; color: #222222; width: ' + (8 * escala),
            position: offCartel.x + ' ' + altoCartel + ' ' + offCartel.z,
            'mirar-camara': ''
          }, marca);
        });

        // --- 10a. AMBIENTACION: elementos simples que acompanan a cada punto del mapa ---
        // Todo se ancla a los puntos reales de los datos (huerta, perritos, locomocion, pampa). Son
        // volumenes simples hechos con primitivas de A-Frame; las posiciones relativas a cada punto
        // (cuantos metros hacia donde) son ESTIMADAS, no medidas. Los autos tienen colision circular.
        function puntoPorNombre(nombre, n) {
          var r = datos.puntos.filter(function (pp) { return pp.nombre === nombre; });
          return r[n || 0] ? aEscena(r[n || 0].lon, r[n || 0].lat) : null;
        }
        function e3(tag, attrs, padre) { return crear(tag, attrs, padre); }

        // Un arbol simple (tronco + dos conos). Mismo estilo que los del humedal.
        function plantarArbol(x, z, tam, verde) {
          var arb = e3('a-entity', { position: x + ' 0 ' + z });
          e3('a-cylinder', { radius: 0.2 * escala * tam, height: 2.2 * escala * tam, position: '0 ' + (1.1 * escala * tam) + ' 0', color: '#6B4F36', 'segments-radial': 6, 'segments-height': 1 }, arb);
          e3('a-cone', { 'radius-bottom': 1.6 * escala * tam, 'radius-top': 0, height: 3.4 * escala * tam, position: '0 ' + (3.4 * escala * tam) + ' 0', color: verde, 'segments-radial': 7, 'segments-height': 1 }, arb);
          e3('a-cone', { 'radius-bottom': 1.1 * escala * tam, 'radius-top': 0, height: 2.6 * escala * tam, position: '0 ' + (5.1 * escala * tam) + ' 0', color: verde, 'segments-radial': 7, 'segments-height': 1 }, arb);
        }

        // PAMPA: un pequeno bosque de 12 arboles alrededor del punto "arboles (pampa)"
        var qPampa = puntoPorNombre('arboles (pampa)');
        if (qPampa) {
          var semP = 11, azarP = function () { semP = (semP * 16807) % 2147483647; return semP / 2147483647; };
          var verdesP = ['#4E9F5B', '#3E8A4E', '#5FAE62', '#477F4A'];
          for (var ip = 0; ip < 12; ip++) {
            var angP = azarP() * Math.PI * 2, radP = (3 + Math.sqrt(azarP()) * 14) * escala;
            plantarArbol(qPampa.x + Math.cos(angP) * radP, qPampa.y + Math.sin(angP) * radP, 0.8 + azarP() * 0.7, verdesP[Math.floor(azarP() * 4)]);
          }
        }

        // HUERTA: cuatro camas de cultivo con plantas, a un costado del cassette
        var qHuerta = puntoPorNombre('huerta');
        if (qHuerta) {
          var verdesH = ['#5FAE62', '#7DBE5A', '#4E9F5B'];
          [[3.2, -1.6], [3.2, 1.6], [7.0, -1.6], [7.0, 1.6]].forEach(function (o, ih) {
            var cama = e3('a-entity', { position: (qHuerta.x + o[0] * escala) + ' 0 ' + (qHuerta.y + o[1] * escala) });
            e3('a-box', { width: 3 * escala, height: 0.3 * escala, depth: 1 * escala, position: '0 ' + (0.15 * escala) + ' 0', color: '#5B4636' }, cama);
            for (var k = 0; k < 4; k++) {
              e3('a-cone', { 'radius-bottom': 0.22 * escala, 'radius-top': 0, height: 0.55 * escala, position: ((k - 1.5) * 0.7 * escala) + ' ' + (0.55 * escala) + ' 0', color: verdesH[(ih + k) % 3], 'segments-radial': 6, 'segments-height': 1 }, cama);
            }
          });
          // cerco bajo: cuatro postes en las esquinas del sector de camas
          [[1.4, -3], [1.4, 3], [8.8, -3], [8.8, 3]].forEach(function (o) {
            e3('a-cylinder', { radius: 0.06 * escala, height: 1.1 * escala, position: (qHuerta.x + o[0] * escala) + ' ' + (0.55 * escala) + ' ' + (qHuerta.y + o[1] * escala), color: '#8C6A46', 'segments-radial': 5, 'segments-height': 1 });
          });
        }

        // PERRITOS: un perro junto a cada cassette de perritos. Se mueven (saltito + cola) mientras
        // suena el audio de los perritos (el mismo que se reproduce desde el rack del CECOF).
        var perros = [];
        function crearPerro(q, color, rotY, offset) {
          var perro = e3('a-entity', { position: (q.x + offset[0] * escala) + ' 0 ' + (q.y + offset[1] * escala), rotation: '0 ' + rotY + ' 0' });
          e3('a-box', { width: 0.7 * escala, height: 0.3 * escala, depth: 0.28 * escala, position: '0 ' + (0.45 * escala) + ' 0', color: color }, perro);
          e3('a-box', { width: 0.26 * escala, height: 0.24 * escala, depth: 0.24 * escala, position: (0.45 * escala) + ' ' + (0.62 * escala) + ' 0', color: color }, perro);
          e3('a-box', { width: 0.12 * escala, height: 0.1 * escala, depth: 0.14 * escala, position: (0.62 * escala) + ' ' + (0.58 * escala) + ' 0', color: '#2B2B2B' }, perro);
          e3('a-box', { width: 0.06 * escala, height: 0.12 * escala, depth: 0.08 * escala, position: (0.4 * escala) + ' ' + (0.78 * escala) + ' ' + (0.1 * escala), color: '#3A2E26' }, perro);
          e3('a-box', { width: 0.06 * escala, height: 0.12 * escala, depth: 0.08 * escala, position: (0.4 * escala) + ' ' + (0.78 * escala) + ' ' + (-0.1 * escala), color: '#3A2E26' }, perro);
          [[0.25, 0.1], [0.25, -0.1], [-0.25, 0.1], [-0.25, -0.1]].forEach(function (pt) {
            e3('a-box', { width: 0.08 * escala, height: 0.3 * escala, depth: 0.08 * escala, position: (pt[0] * escala) + ' ' + (0.15 * escala) + ' ' + (pt[1] * escala), color: color }, perro);
          });
          var cola = e3('a-entity', { position: (-0.36 * escala) + ' ' + (0.58 * escala) + ' 0', rotation: '0 0 35' }, perro);
          e3('a-box', { width: 0.3 * escala, height: 0.06 * escala, depth: 0.06 * escala, position: (-0.13 * escala) + ' 0 0', color: color }, cola);
          perros.push({ el: perro, cola: cola });
        }
        var qPerA = puntoPorNombre('perritos callejeros', 0), qPerB = puntoPorNombre('perritos callejeros', 1);
        if (qPerA) crearPerro(qPerA, '#B88A5B', 40, [1.4, 1.0]);
        if (qPerB) crearPerro(qPerB, '#3F3A36', 200, [1.4, -1.0]);
        var audioPerros = document.getElementById('audio-perritos');
        function animarPerros(suena) {
          perros.forEach(function (pr) {
            if (suena) {
              pr.el.setAttribute('animation__saltito', 'property: object3D.position.y; from: 0; to: ' + (0.12 * escala) + '; dur: 260; dir: alternate; loop: true; easing: easeInOutQuad');
              pr.cola.setAttribute('animation__cola', 'property: object3D.rotation.y; from: -35; to: 35; dur: 140; dir: alternate; loop: true; easing: linear');
            } else {
              pr.el.removeAttribute('animation__saltito'); pr.el.object3D.position.y = 0;
              pr.cola.removeAttribute('animation__cola'); pr.cola.object3D.rotation.y = 0;
            }
          });
        }
        if (audioPerros) {
          audioPerros.addEventListener('play', function () { animarPerros(true); });
          audioPerros.addEventListener('pause', function () { animarPerros(false); });
          audioPerros.addEventListener('ended', function () { animarPerros(false); });
        }

        // LOCOMOCION: 5 colectivos estacionados junto al punto (negros, sin clic, solo colision circular).
        // Los que circulan por las calles se crean mas abajo (bloque "VIDA DEL BARRIO").
        var qLoco = puntoPorNombre('Locomocion');
        var estacionados = [];
        if (qLoco) {
          [[-5, 2, 0], [-5, 8, 0], [-5, 14, 0], [5, 5, 180], [5, 11, 180]].forEach(function (o) {
            estacionados.push({ x: qLoco.x + o[0] * escala, z: qLoco.y + o[1] * escala, rot: (90 + o[2]) * Math.PI / 180 });
            colisiones.push({ x: qLoco.x + o[0] * escala, z: qLoco.y + o[1] * escala, radio: 1.8 * escala });
          });
        }

        // Union de los dos tipos de colision (edificios reales/relleno + gimnasio/CECOF):
        // se usan en tick() para que caminar en linea recta no atraviese los volumenes.
        this.colisiones = colisiones.concat(colisionesEdificios);

        // --- 10. BASURA Y RECICLAJE (iconos X rojos y tickets verdes del mapa de referencia): MISION SECUNDARIA ---
        // "basural" = X roja: un monton de cajas que se recoge con un clic (queda "llevando", en la bolsa de la mano).
        // "naturaleza" = ticket verde: contenedor verde; un clic con basura en la mano la deposita y enciende su punto verde.
        // "rocura" = punto azul (solo decorativo). Las posiciones vienen de los datos.
        var semB = 3, azarB = function () { semB = (semB * 16807) % 2147483647; return semB / 2147483647; };
        var coloresBasura = ['#7A7A72', '#8A6F4E', '#4F6F86', '#A8A39A', '#6B4F36', '#5A7A55'];
        var idxBasura = 0, idxContenedor = 0;
        function conSonido(g, nombre, snd) {
          g.setAttribute('sound__' + nombre, 'src: #' + snd + '; positional: true; poolSize: 2; volume: 1; refDistance: 1');
          return function () { var c = g.components['sound__' + nombre]; if (c && c.loaded !== false) c.playSound(); };
        }
        function manita(g) {
          g.addEventListener('mouseenter', function () { g.sceneEl.canvas.style.cursor = 'pointer'; });
          g.addEventListener('mouseleave', function () { g.sceneEl.canvas.style.cursor = ''; });
        }
        datos.reciclaje.forEach(function (r) {
          var q = aEscena(r.lon, r.lat);
          var g = crear('a-entity', { position: q.x + ' 0 ' + q.y });
          if (r.tipo === 'basural') {
            var miIdx = idxBasura++;
            for (var ib = 0; ib < 9; ib++) {
              var w = (0.3 + azarB() * 0.5) * escala, h = (0.2 + azarB() * 0.45) * escala;
              crear('a-box', {
                width: w, height: h, depth: (0.3 + azarB() * 0.5) * escala,

                rotation: '0 ' + Math.round(azarB() * 180) + ' 0', color: coloresBasura[ib % coloresBasura.length], class: 'clickable'

            }
            var sonarGolpe = conSonido(g, 'golpe', 'snd-golpe');
            function quitarMonton() {
              g.setAttribute('visible', false);

            }
            if (basuraLlevada(miIdx) || basuraDepositada(miIdx)) { quitarMonton(); }
            else {

              g.addEventListener('click', function () {

                window.dispatchEvent(new CustomEvent('norte-maps:basura'));

          } else if (r.tipo === 'naturaleza') {
