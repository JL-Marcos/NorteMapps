            crear('a-cylinder', { radius: 0.35 * escala, height: 1 * escala, position: '0 ' + (0.5 * escala) + ' 0', color: '#2E7D4F', 'segments-radial': 10, 'segments-height': 1, class: 'clickable' }, g);
            crear('a-cylinder', { radius: 0.4 * escala, height: 0.08 * escala, position: '0 ' + (1.04 * escala) + ' 0', color: '#1F5C38', 'segments-radial': 10, 'segments-height': 1, class: 'clickable' }, g);
            var luzC = crear('a-sphere', { radius: 0.12 * escala, position: '0 ' + (1.3 * escala) + ' 0', 'segments-width': 8, 'segments-height': 6 }, g);
            function pintarLuzC() {
              luzC.setAttribute('material', contenedorUsado(miC) ? 'color: #2BE05A; emissive: #2BE05A; emissiveIntensity: 1.4' : 'color: #3A3A3A');
            }
            pintarLuzC();
            var sonarCampana = conSonido(g, 'campana', 'snd-campana');
            manita(g);
            g.addEventListener('click', function () {
              g.object3D.scale.setScalar(1.12); setTimeout(function () { g.object3D.scale.setScalar(1); }, 120);   // pulso
              if (contarBasuraLlevando() === 0) return;
              depositarBasura();
              localStorage.setItem('norte-maps-contenedor-usado-' + miC, '1'); pintarLuzC(); sonarCampana();
            });
          } else {
            crear('a-cylinder', { radius: 0.25 * escala, height: 0.5 * escala, position: '0 ' + (0.25 * escala) + ' 0', color: '#3B8FA8', 'segments-radial': 10, 'segments-height': 1 }, g);
          }
        });

        // --- 10a2. TEXTURAS DE SUELO, HUMEDAL (totora y agua) Y PASTO ---
        // Las texturas se dibujan con un <canvas> (sin archivos de imagen: cero peso extra de descarga) y se repiten
        // sobre el suelo. Los poligonos del humedal y del pasto se midieron sobre el mapa referencial (aproximados).
        function textura(base, motas, n, minT, maxT, horiz) {
          var c = document.createElement('canvas'); c.width = c.height = 256;
          var g = c.getContext('2d'); g.fillStyle = base; g.fillRect(0, 0, 256, 256);
          var sm = 5, az = function () { sm = (sm * 16807) % 2147483647; return sm / 2147483647; };
          for (var i = 0; i < n; i++) {
            var x = az() * 256, y = az() * 256, w = minT + az() * (maxT - minT), h = horiz ? 1 + az() * 1.5 : w;
            g.globalAlpha = 0.35 + az() * 0.5; g.fillStyle = motas[i % motas.length];
            for (var dx = -256; dx <= 256; dx += 256) for (var dy = -256; dy <= 256; dy += 256) g.fillRect(x + dx, y + dy, w, h);   // repite en los bordes: sin costuras
          }
          var t = new THREE.CanvasTexture(c);
          t.wrapS = t.wrapT = THREE.RepeatWrapping;
          if (THREE.SRGBColorSpace) t.colorSpace = THREE.SRGBColorSpace;
          t.anisotropy = 4;
          return t;
        }
        function aplicarTextura(mesh, tex, tileReal) {
          tex.repeat.set(1 / (tileReal * escala), 1 / (tileReal * escala));
          mesh.material.map = tex; mesh.material.color.set('#ffffff'); mesh.material.needsUpdate = true;
        }
        // suelo general (campo abierto) y terreno del barrio
        aplicarTextura(el.getObject3D('suelo'), textura('#8FA06A', ['#7C8F5A', '#A2B075', '#6E8450', '#B5B887'], 1400, 2, 6), 9);
        aplicarTextura(el.getObject3D('territorio'), textura('#BFC49E', ['#B0B58E', '#CDD1AE', '#A89F7C', '#C9BE97'], 1100, 2, 5), 6);

        // poligonos (metros reales desde el gimnasio): [x, z]
        var POLI_HUMEDAL = [[6.7,245.4],[39.0,264.5],[74.3,295.3],[83.1,332.1],[61.1,368.8],[46.4,405.6],[-5.0,421.8],[-56.5,409.3],[-78.5,390.9],[-62.4,372.6],[-44.7,339.5],[-23.4,295.4]];
        var POLI_PASTO = [[-161.0,50.7],[-106.6,81.5],[-106.6,118.3],[-138.2,126.4],[-201.4,118.3],[-185.2,87.5]];
        function polig(lista, k) { return lista.map(function (q) { return new THREE.Vector2(q[0] * escala * (k || 1), -q[1] * escala * (k || 1)); }); }
        function parche(lista, tex, tileReal, orden, k) {
          var forma = new THREE.ShapeGeometry(new THREE.Shape(polig(lista, k)));
          forma.rotateX(-Math.PI / 2);
          var mesh = malla(forma, '#ffffff', orden); aplicarTextura(mesh, tex, tileReal); return mesh;
        }
        function enPoli(x, z, lista) {   // x, z en unidades de escena
          var dentro = false;
          for (var i = 0, j = lista.length - 1; i < lista.length; j = i++) {
            var xi = lista[i][0] * escala, zi = lista[i][1] * escala, xj = lista[j][0] * escala, zj = lista[j][1] * escala;
            if ((zi > z) !== (zj > z) && x < (xj - xi) * (z - zi) / (zj - zi) + xi) dentro = !dentro;
          }
          return dentro;
        }
        // centro del humedal; el nucleo de agua es el mismo poligono achicado al 55% hacia su centro
        var cenH = POLI_HUMEDAL.reduce(function (s, q) { return [s[0] + q[0] / POLI_HUMEDAL.length, s[1] + q[1] / POLI_HUMEDAL.length]; }, [0, 0]);
        var POLI_AGUA = POLI_HUMEDAL.map(function (q) { return [cenH[0] + (q[0] - cenH[0]) * 0.55, cenH[1] + (q[1] - cenH[1]) * 0.55]; });
        el.setObject3D('humedal-barro', parche(POLI_HUMEDAL, textura('#56673F', ['#465A34', '#667A48', '#3F5230', '#76803F'], 1200, 2, 6), 7, -1.5));
        el.setObject3D('humedal-agua', parche(POLI_AGUA, textura('#2F5D6B', ['#3E7584', '#264D5A', '#5B8E9B'], 700, 8, 26, true), 10, -1.4));
        el.setObject3D('pasto-perritos', parche(POLI_PASTO, textura('#98A860', ['#86984F', '#A9B66E', '#B8A870', '#C2B27C'], 1200, 2, 5), 6, -1.5));

        // TOTORA: juncos delgados (conos de 4 caras), uno solo InstancedMesh. Los mas altos y densos hacia el agua.
        (function () {
          var N = 1100, minX = 1e9, maxX = -1e9, minZ = 1e9, maxZ = -1e9;
          POLI_HUMEDAL.forEach(function (q) { minX = Math.min(minX, q[0]); maxX = Math.max(maxX, q[0]); minZ = Math.min(minZ, q[1]); maxZ = Math.max(maxZ, q[1]); });
          var geo = new THREE.ConeGeometry(0.07 * escala, 1, 4); geo.translate(0, 0.5, 0);
          var mesh = new THREE.InstancedMesh(geo, new THREE.MeshStandardMaterial({ color: '#ffffff', roughness: 1, flatShading: true }), N);
          mesh.frustumCulled = false;
          var m4 = new THREE.Matrix4(), q4 = new THREE.Quaternion(), e4 = new THREE.Euler(), col = new THREE.Color();
          var verdes = ['#6F8F3A', '#8DA24A', '#A39A4A', '#5E7E34'];
          var sm = 99, az = function () { sm = (sm * 16807) % 2147483647; return sm / 2147483647; };
          var n = 0, intentos = 0;
          while (n < N && intentos < 20000) {
            intentos++;
            var X = minX + az() * (maxX - minX), Z = minZ + az() * (maxZ - minZ);
            if (!enPoli(X * escala, Z * escala, POLI_HUMEDAL)) continue;
            var h = (1.1 + az() * 1.0) * escala;
            e4.set((az() - 0.5) * 0.25, az() * 6.28, (az() - 0.5) * 0.25);
            q4.setFromEuler(e4);
            m4.compose(new THREE.Vector3(X * escala, 0, Z * escala), q4, new THREE.Vector3(1, h, 1));
            mesh.setMatrixAt(n, m4); mesh.setColorAt(n, col.set(verdes[Math.floor(az() * verdes.length)])); n++;
          }
          mesh.count = n; mesh.instanceMatrix.needsUpdate = true; mesh.instanceColor.needsUpdate = true;
          el.object3D.add(mesh);
        })();

        // --- 10a3. VIDA DEL BARRIO: colectivos y buses por las calles, perritos que caminan ---
        // Todo es movimiento "a mano": en cada cuadro (tick) se recalcula la posicion de cada vehiculo a lo largo
        // de una calle de los datos. No hace falta ningun componente especial de A-Frame. Los colectivos son
        // InstancedMesh (pocas llamadas de dibujo). Los que circulan NO tienen colision (la camara los atraviesa).
        var ONE = new THREE.Vector3(1, 1, 1), QID = new THREE.Quaternion(), EJE_Y = new THREE.Vector3(0, 1, 0);
        var mV = new THREE.Matrix4(), mP = new THREE.Matrix4(), vPos = new THREE.Vector3(), vQuat = new THREE.Quaternion();
        function instanciada(geo, color, n) {
          var im = new THREE.InstancedMesh(geo, new THREE.MeshStandardMaterial({ color: color, roughness: 0.8, flatShading: true }), n);
          im.frustumCulled = false; el.object3D.add(im); return im;
        }
        function caja() { return new THREE.BoxGeometry(1, 1, 1); }
        // coloca la parte "idx" de una instancia: pos/rot del vehiculo y pos/escala locales de la parte (en metros reales)
        var pLocal = new THREE.Vector3(), pEsc = new THREE.Vector3();
        function ponerParte(im, idx, lx, ly, lz, sx, sy, sz, qLocal) {
          mV.compose(vPos, vQuat, ONE);
          pLocal.set(lx * escala, ly * escala, lz * escala); pEsc.set(sx * escala, sy * escala, sz * escala);
          mP.compose(pLocal, qLocal || QID, pEsc);
          im.setMatrixAt(idx, mV.multiply(mP));
        }

        // --- rutas: cada calle de los datos, en unidades de escena, con largos acumulados ---
        var rutas = [];
        datos.calles.forEach(function (c) {
          var pts = c.pts.map(function (q) { return aEscena(q[0], q[1]); });
          var acum = [0];
          for (var i = 1; i < pts.length; i++) acum.push(acum[i - 1] + pts[i].distanceTo(pts[i - 1]));
          if (acum[acum.length - 1] / escala >= 120) rutas.push({ nombre: c.nombre, pts: pts, acum: acum, largo: acum[acum.length - 1] });
        });
        function enRuta(r, s) {   // posicion y direccion (unitaria) a la distancia s del inicio de la ruta
          var i = 1; while (i < r.acum.length - 1 && r.acum[i] < s) i++;
          var a = r.pts[i - 1], b = r.pts[i], d = b.clone().sub(a), L = d.length() || 1;
          var k = (s - r.acum[i - 1]) / L; d.divideScalar(L);
          return { x: a.x + (b.x - a.x) * k, z: a.y + (b.y - a.y) * k, dx: d.x, dz: d.y };
        }

        var COLECTIVOS_MOVIL = 10, N_COL = COLECTIVOS_MOVIL + estacionados.length;
        var imCuerpo = instanciada(caja(), '#111111', N_COL);
        var imCabina = instanciada(caja(), '#3C4A55', N_COL);
        var imCartel = instanciada(caja(), '#F2C300', N_COL);
        imCartel.material.emissive = new THREE.Color('#5A4700');
        var geoRueda = new THREE.CylinderGeometry(1, 1, 1, 10); geoRueda.rotateX(Math.PI / 2);
        var imRueda = instanciada(geoRueda, '#1A1A1A', N_COL * 4);
        var colectivos = [];
        var smC = 17, azC = function () { smC = (smC * 16807) % 2147483647; return smC / 2147483647; };
        for (var ic = 0; ic < COLECTIVOS_MOVIL && rutas.length; ic++) {
          var rt = rutas[ic % rutas.length];
          colectivos.push({ ruta: rt, s: azC() * rt.largo, dir: azC() < 0.5 ? 1 : -1, vel: (5 + azC() * 3) * escala, parado: false });
        }
        estacionados.forEach(function (e) { colectivos.push({ parado: true, x: e.x, z: e.z, rot: e.rot }); });
        var qRueda = new THREE.Quaternion();
        function dibujarColectivo(i, c) {
          ponerParte(imCuerpo, i, 0, 0.65, 0, 4.4, 0.75, 1.8);
          ponerParte(imCabina, i, -0.2, 1.3, 0, 2.2, 0.6, 1.6);
          ponerParte(imCartel, i, -0.2, 1.75, 0, 0.5, 0.18, 0.7);   // el cartelito amarillo del techo
          var w = [[1.3, 0.9], [1.3, -0.9], [-1.3, 0.9], [-1.3, -0.9]];
          for (var k = 0; k < 4; k++) ponerParte(imRueda, i * 4 + k, w[k][0], 0.32, w[k][1], 0.32, 0.32, 0.22);
        }
        function actualizarColectivos(dt) {
          for (var i = 0; i < colectivos.length; i++) {
            var c = colectivos[i];
            if (c.parado) { vPos.set(c.x, 0, c.z); vQuat.setFromAxisAngle(EJE_Y, c.rot); }
            else {
              c.s += c.dir * c.vel * dt / 1000;
              if (c.s > c.ruta.largo) { c.s = c.ruta.largo; c.dir = -1; } else if (c.s < 0) { c.s = 0; c.dir = 1; }
              var pr = enRuta(c.ruta, c.s), lado = 2.2 * escala * c.dir;   // por la derecha de su sentido de marcha
              vPos.set(pr.x + (-pr.dz) * lado * Math.sign(c.dir), 0, pr.z + pr.dx * lado * Math.sign(c.dir));
              vQuat.setFromAxisAngle(EJE_Y, -Math.atan2(pr.dz * c.dir, pr.dx * c.dir));
            }
            dibujarColectivo(i, c);
          }
          [imCuerpo, imCabina, imCartel, imRueda].forEach(function (im) { im.instanceMatrix.needsUpdate = true; });
        }

        // --- el bus (linea "2"): una entidad normal con unos pocos volumenes, recorre la Avenida ---
        var rutaBus = rutas.filter(function (r) { return r.nombre.indexOf('Avenida') === 0; })[0] || rutas[0];
        var bus = null;
        if (rutaBus) {
          bus = crear('a-entity', { position: '0 0 0' });
          crear('a-box', { width: 10 * escala, height: 2.6 * escala, depth: 2.5 * escala, position: '0 ' + (1.7 * escala) + ' 0', color: '#F1EFE6' }, bus);
          crear('a-box', { width: 9 * escala, height: 0.9 * escala, depth: 2.54 * escala, position: '0 ' + (2.2 * escala) + ' 0', color: '#2C3B47' }, bus);
          crear('a-box', { width: 10.02 * escala, height: 0.4 * escala, depth: 2.52 * escala, position: '0 ' + (1.0 * escala) + ' 0', color: '#C8553D' }, bus);
          crear('a-text', { value: '2', align: 'center', color: '#C8553D', width: 5 * escala, position: (5.03 * escala) + ' ' + (2.9 * escala) + ' 0', rotation: '0 90 0' }, bus);
          crear('a-text', { value: '2', align: 'center', color: '#C8553D', width: 5 * escala, position: (-5.03 * escala) + ' ' + (2.9 * escala) + ' 0', rotation: '0 -90 0' }, bus);
          [[3.2, 1.2], [3.2, -1.2], [-3.2, 1.2], [-3.2, -1.2]].forEach(function (rw) {
            crear('a-cylinder', { radius: 0.5 * escala, height: 0.3 * escala, rotation: '90 0 0', position: (rw[0] * escala) + ' ' + (0.5 * escala) + ' ' + (rw[1] * escala), color: '#1A1A1A', 'segments-radial': 10, 'segments-height': 1 }, bus);
          });
        }
        var busEstado = { s: rutaBus ? rutaBus.largo * 0.3 : 0, dir: 1, vel: 7 * escala };
        function actualizarBus(dt) {
          if (!bus || !rutaBus) return;
          busEstado.s += busEstado.dir * busEstado.vel * dt / 1000;
          if (busEstado.s > rutaBus.largo) { busEstado.s = rutaBus.largo; busEstado.dir = -1; } else if (busEstado.s < 0) { busEstado.s = 0; busEstado.dir = 1; }
          var pr = enRuta(rutaBus, busEstado.s), lado = 2.6 * escala * busEstado.dir;
          bus.object3D.position.set(pr.x + (-pr.dz) * lado * Math.sign(busEstado.dir), 0, pr.z + pr.dx * lado * Math.sign(busEstado.dir));
          bus.object3D.rotation.y = -Math.atan2(pr.dz * busEstado.dir, pr.dx * busEstado.dir);
        }

        // --- perritos que caminan por el barrio (8): cada uno vaga cerca de "su" punto del mapa ---
        var NOMBRES_CASA = [['perritos callejeros', 0], ['perritos callejeros', 1], ['el narigon', 0], ['huerta', 0], ['humedal', 0], ['Comida Rapida', 0], ['cancha de Rancagua', 0], ['gimnasio', 0]];
        var casasPerros = [];
        NOMBRES_CASA.forEach(function (nc) { var q = puntoPorNombre(nc[0], nc[1]); if (q) casasPerros.push(q); });
        var N_PER = casasPerros.length;
        var imPerroCuerpo = instanciada(caja(), '#ffffff', N_PER), imPerroCabeza = instanciada(caja(), '#ffffff', N_PER);
        var imPerroHocico = instanciada(caja(), '#2B2B2B', N_PER), imPerroOreja = instanciada(caja(), '#3A2E26', N_PER * 2);
        var geoPata = caja(); geoPata.translate(0, -0.5, 0);   // pivote arriba: la pata oscila desde la cadera
        var imPerroPata = instanciada(geoPata, '#ffffff', N_PER * 4);
        var geoCola = caja(); geoCola.translate(-0.5, 0, 0);   // pivote en la base de la cola
        var imPerroCola = instanciada(geoCola, '#ffffff', N_PER);
        var coloresPerro = ['#B88A5B', '#3F3A36', '#D8C7A0', '#8A6B4A', '#6A5A4A', '#C9A06A', '#2E2A27', '#A8805A'];
        [imPerroCuerpo, imPerroCabeza, imPerroPata, imPerroCola].forEach(function (im) {
          var cc = new THREE.Color(); for (var i = 0; i < im.count; i++) { var d = im === imPerroPata ? Math.floor(i / 4) : i; im.setColorAt(i, cc.set(coloresPerro[d % coloresPerro.length])); }
          im.instanceColor.needsUpdate = true;
        });
        var perrosVagan = casasPerros.map(function (q, i) {
          return { x: q.x + (i % 3 - 1) * 2 * escala, z: q.y + ((i + 1) % 3 - 1) * 2 * escala, hx: q.x, hz: q.y, tx: q.x, tz: q.y, rumbo: 0, fase: i * 1.7, espera: 0 };
        });
        var qPata = new THREE.Quaternion(), qCola = new THREE.Quaternion(), eZ = new THREE.Vector3(0, 0, 1), eY2 = new THREE.Vector3(0, 1, 0);
        function bloqueado(x, z) {
          if (dentroDeVolumen(x / escala, z / escala, 0.8)) return true;
          var i; for (i = 0; i < colisionesEdificios.length; i++) { var c = colisionesEdificios[i]; if (Math.hypot(x - c.x, z - c.z) < c.radio) return true; }
          return false;
        }
        function actualizarPerros(dt, tms) {
          var v = 1.3 * escala * dt / 1000;
          for (var i = 0; i < perrosVagan.length; i++) {
            var p = perrosVagan[i], dx = p.tx - p.x, dz = p.tz - p.z, d = Math.hypot(dx, dz), andando = false;
            if (p.espera > 0) p.espera -= dt;
            else if (d < 0.6 * escala) {   // llego: descansa un rato y elige otro destino a menos de 18 m de su punto
              p.espera = 1500 + Math.random() * 3500;
              var ang = Math.random() * 6.283, r = (4 + Math.random() * 14) * escala;
              p.tx = p.hx + Math.cos(ang) * r; p.tz = p.hz + Math.sin(ang) * r;
            } else {
              var nx = p.x + dx / d * v, nz = p.z + dz / d * v;
              if (bloqueado(nx, nz)) { p.tx = p.x; p.tz = p.z; p.espera = 300; }   // hay una pared: se detiene y elige otro destino
              else { p.x = nx; p.z = nz; p.rumbo = Math.atan2(-dz, dx); andando = true; p.fase += dt / 90; }
            }
            vPos.set(p.x, andando ? Math.abs(Math.sin(p.fase)) * 0.04 * escala : 0, p.z);
            vQuat.setFromAxisAngle(EJE_Y, p.rumbo);
            var col = coloresPerro[i % coloresPerro.length];
            ponerParte(imPerroCuerpo, i, 0, 0.45, 0, 0.7, 0.3, 0.28);

            ? '<br>Botones ▲ ▼ para caminar (⏩ rápido) · arrastra el dedo o gira el teléfono para mirar · toca cassettes, puertas y basura'
            : '<br>W A S D caminar · Shift correr · arrastrar el mouse para mirar · clic en cassettes, puertas y basura' +
              '<br>Otra escala: agregar <b>?escala=1</b> a la direccion') +
          '<br><small>Edificios: ' + this.nReal + ' reales (© colaboradores de OpenStreetMap) + ' + this.nRelleno + ' casas de relleno inventadas (<b>?relleno=no</b> las oculta)</small>';
      },

      // Colision simple, en tres capas (corre TODOS los cuadros; HUD/minimapa, mas caros, cada 15):
      //  1) salas: la camara no puede salir de las paredes interiores;
      //  2) volumenes de referencia exteriores (gimnasio/CECOF): rectangulos, se empuja a la cara mas cercana;
      //  3) edificios del mapa (OpenStreetMap y relleno): circulos (centro+radio), se empuja por el borde.
      resolverColisiones: function () {
        var p = this.camara.object3D.position;
        var m = 0.6 * this.escala;   // margen alrededor de los volumenes
        (this.salas || []).forEach(function (s) {
          if (Math.abs(p.x - s.x) < s.fuera && Math.abs(p.z - s.z) < s.fuera) {
            p.x = Math.max(s.x - s.half, Math.min(s.x + s.half, p.x));
            p.z = Math.max(s.z - s.half, Math.min(s.z + s.half, p.z));
          }
        });
        (this.cajas || []).forEach(function (c) {
          // rectangulo orientado: se pasa la camara al sistema local del volumen, se empuja a la cara mas cercana
          var dx = p.x - c.cx, dz = p.z - c.cz;
          var lx = dx * c.ux + dz * c.uz, lz = dx * c.vx + dz * c.vz;
          var ex = c.hx + m, ez = c.hz + m;
          if (Math.abs(lx) < ex && Math.abs(lz) < ez) {
            if (ex - Math.abs(lx) < ez - Math.abs(lz)) lx = lx < 0 ? -ex : ex; else lz = lz < 0 ? -ez : ez;
            p.x = c.cx + lx * c.ux + lz * c.vx;
            p.z = c.cz + lx * c.uz + lz * c.vz;
          }
        });
        if (!this.colisiones || !this.colisiones.length) return;
        // OJO ESTABILIDAD: se resuelve SOLO el circulo con mayor penetracion por cuadro (si hay
        // varios superpuestos, se arreglan de a uno en los cuadros siguientes).
        var peor = null, peorPenetracion = 0;
        for (var i = 0; i < this.colisiones.length; i++) {
          var c = this.colisiones[i];
          var dist = Math.hypot(p.x - c.x, p.z - c.z);
          var penetracion = c.radio - dist;
          if (penetracion > peorPenetracion) { peorPenetracion = penetracion; peor = c; }
        }
        if (peor) {
          var dx = p.x - peor.x, dz = p.z - peor.z;
          var dist2 = Math.hypot(dx, dz);
          if (dist2 > 0.0001) {
            var k = peor.radio / dist2;
            p.x = peor.x + dx * k;
            p.z = peor.z + dz * k;
          } else {
            p.x = peor.x + peor.radio;
          }
        }
      },

      // Cada ~15 cuadros actualizamos la distancia al gimnasio y el minimapa
      // (no hace falta redibujar en cada cuadro); la colision, en cambio, se revisa siempre.
      tick: function (t, dt) {
        if (!this.camara) return;
        if (AVANCE.v) {   // caminar con los botones tactiles: hacia donde mira la camara, en horizontal
          var camT = this.camara, dirT = this._dirT || (this._dirT = new THREE.Vector3());
          camT.object3D.getWorldDirection(dirT); dirT.y = 0;
          if (dirT.lengthSq() > 1e-6) {
            dirT.normalize();
            var enSalaT = camT.object3D.position.x > 200;   // dentro de las salas, mas lento
            var velT = (AVANCE.rapido ? 3.0 : 0.9) * (enSalaT ? 0.4 : 1) * AVANCE.v * Math.min(dt || 16, 100) / 1000;
            camT.object3D.position.x -= dirT.x * velT; camT.object3D.position.z -= dirT.z * velT;
          }
        }
        this.resolverColisiones();
        if (this.vida) this.vida(Math.min(dt || 16, 100));   // vehiculos y perritos en movimiento
        this.contador++;
        if (this.contador % 15) return;
        var p = this.camara.object3D.position;
        this.escribirHud(Math.sqrt(p.x * p.x + p.z * p.z));
        if (this.dibujarMinimapa) this.dibujarMinimapa();
      }
    });
  </script>
</head>

<body>
  <div id="hud"><div id="hud-cuerpo"></div><button id="hud-boton">? Ayuda</button></div>

  <!-- Minimapa: vista cenital fija del barrio (calles, territorio, puntos) con la
       posicion y orientacion del visitante, para ubicarse en contexto mientras se
       camina. Lo dibuja el componente norte-maps (ver funcion "dibujarMinimapa"). -->
  <!-- top:56px: justo debajo del contador de relatos (que ocupa la esquina superior
       derecha), para no toparse ni con ese contador ni con el boton del documental
       (que esta abajo a la derecha). -->
  <canvas id="minimapa" width="150" height="150"
    style="position:fixed; right:12px; top:56px; z-index:10; border-radius:8px; opacity:0.6;
           border:1px solid rgba(0,0,0,0.2); background:transparent;"></canvas>

  <!-- Contador de recoleccion: cuantos "cassettes" ya se sacaron del mapa.
       Se actualiza solo (evento norte-maps:recoleccion) cada vez que recolectas uno.
       Va arriba a la DERECHA (no arriba a la izquierda) para no toparse con el panel
       de estadisticas de A-Frame (stats="fps/triangulos"), que ocupa esa esquina. -->
  <div id="contador-recoleccion"
    style="position:fixed; right:12px; top:12px; z-index:10; font:13px system-ui, sans-serif;
           padding:6px 12px; border-radius:6px; background:rgba(255,255,255,0.85); color:#222;"></div>

  <!-- Reiniciar: borra lo recolectado en ESTE navegador y recarga (no habia forma de
       volver a empezar sin abrir la consola). Pide confirmacion antes de borrar. -->
  <button id="boton-reiniciar"
    style="position:fixed; left:50%; transform:translateX(-50%); top:12px; z-index:10; font:12px system-ui, sans-serif;
           padding:5px 10px; border-radius:6px; border:0; background:rgba(0,0,0,0.55); color:#fff; cursor:pointer; white-space:nowrap;">
    ⟲ Reiniciar
  </button>

  <!-- Controles tactiles (solo se ven en telefono/tablet): caminar mientras se mantienen presionados -->
  <div id="ctl-tactil">
    <button class="ctl-btn" id="ctl-rapido" aria-label="Avanzar rápido">⏩</button>
    <button class="ctl-btn" id="ctl-avanzar" aria-label="Avanzar">▲</button>
    <button class="ctl-btn" id="ctl-retroceder" aria-label="Retroceder">▼</button>
  </div>

  <div id="aviso"></div>

  <!-- El documental (video externo embebido via YouTube, no alojado aqui: el original
       pesa ~2GB) ya NO se abre con un boton flotante: ahora se reproduce desde la
       pantalla/proyector dentro de la sala del gimnasio, y solo se desbloquea al
       completar los 9 relatos (ver "construirSalaGimnasio" en el script). Esta caja
       de modal + iframe se mantiene, solo cambio quien la dispara. -->
  <div id="modal-documental"
    style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:20;
           align-items:center; justify-content:center;">
    <div style="position:relative; width:90%; max-width:800px; aspect-ratio:16/9;">
      <iframe id="iframe-documental" src="" title="Documental Norte Maps"
        style="width:100%; height:100%; border:0;" allow="autoplay; encrypted-media" allowfullscreen></iframe>
      <button id="cerrar-documental"
        style="position:absolute; top:-36px; right:0; font:13px system-ui, sans-serif;
               padding:4px 10px; border-radius:4px; border:0; background:#fff; cursor:pointer;">Cerrar ✕</button>
    </div>
  </div>

  <script>
    document.getElementById('cerrar-documental').addEventListener('click', function () {
      document.getElementById('modal-documental').style.display = 'none';
      document.getElementById('iframe-documental').src = '';
    });
  </script>

  <!-- ESCENA
       stats                            -> panel de rendimiento (fps, triangulos)
       background                       -> color de fondo (en vez de un cielo, que pesa mas)
       cursor="rayOrigin: mouse"        -> el mouse es el puntero que activa los objetos
       raycaster="objects: .clickable"  -> solo reaccionan los objetos con class="clickable"
       (la niebla la pone el componente norte-maps segun la escala) -->
  <a-scene stats background="color: #ECECEC" cursor="rayOrigin: mouse" raycaster="objects: .clickable">

    <!-- ARCHIVOS QUE SE CARGAN (modelo 3D de la radio y los relatos en audio) -->
    <a-assets>
      <a-asset-item id="radio" src="activos/radio.glb"></a-asset-item>
      <!-- Relatos reales grabados por la Cooperativa (mismos audios publicados en su Spotify) -->
      <!-- Sonidos cortos de los clics de extraccion (componente oficial "sound", posicional) -->
      <audio id="snd-golpe" src="activos/golpe.mp3" preload="auto"></audio>
      <audio id="snd-campana" src="activos/campana.mp3" preload="auto"></audio>
      <audio id="audio-gimnasio" src="activos/gimnasio.mp3" preload="auto"></audio>
      <audio id="audio-radio" src="activos/radio.mp3" preload="auto"></audio>
      <audio id="audio-cecof" src="activos/cecof.mp3" preload="auto"></audio>
      <audio id="audio-comida-rapida" src="activos/comida-rapida.mp3" preload="auto"></audio>
      <audio id="audio-perritos" src="activos/perritos.mp3" preload="auto"></audio>
      <audio id="audio-cancha" src="activos/cancha.mp3" preload="auto"></audio>
      <audio id="audio-locomocion" src="activos/locomocion.mp3" preload="auto"></audio>
      <audio id="audio-huerta" src="activos/huerta.mp3" preload="auto"></audio>
      <!-- Foto real del mural pintado en el gimnasio (se muestra completa e iluminada en su sala). -->
      <img id="mural-completo" src="activos/mural/mural-completo.jpg">
    </a-assets>

    <!-- EL BARRIO, a escala reducida (1:5) para que el recorrido completo sea comodo.
         La sensacion de "gigante" de antes no era por la escala del mapa, sino porque
         la altura de la camara se quedaba fija en 1.6 m reales: ahora la altura del ojo
         tambien se achica con la escala (ver "camaraInicio" mas abajo en el codigo).
         Para probar a tamaño real: escala: 1, o agregar ?escala=1 en la direccion. -->
    <a-entity id="mapa" norte-maps="escala: 0.2"></a-entity>

    <!-- CAMARA: es el "ojo" del visitante. Su posicion inicial la calcula norte-maps (junto al gimnasio).
         near: 0.1 -> lo mas cercano que se dibuja; mejora la nitidez del suelo a lo lejos.
         correr    -> con Shift camina mas rapido -->
    <a-entity camera="fov: 60; near: 0.1" look-controls wasd-controls="acceleration: 15" correr
              position="0 1.6 5">
      <!-- Lo que llevas en la mano: aparece cuando recolectas un cassette del mapa y
           hasta que lo depositas en la radio (ver marcarLlevando/depositarTodo en el
           script). Es hijo de la camara, asi que se mueve y gira con la vista. -->
      <a-entity id="mano-cassettes" visible="false" position="0.45 -0.32 -0.9" scale="0.35 0.35 0.35">
        <a-box width="0.18" height="0.03" depth="0.11" color="#3B8FA8"></a-box>
        <a-cylinder radius="0.028" height="0.034" position="-0.045 0.02 0" color="#222" segments-radial="10"></a-cylinder>
        <a-cylinder radius="0.028" height="0.034" position="0.045 0.02 0" color="#222" segments-radial="10"></a-cylinder>
        <a-entity id="texto-mano" text="value: ; align: center; color: #fff; width: 3" position="0 0.12 0"></a-entity>
      </a-entity>
      <!-- Bolsa de basura que llevas (mision secundaria), a la izquierda -->
      <a-entity id="mano-basura" visible="false" position="-0.45 -0.32 -0.9" scale="0.35 0.35 0.35">
        <a-box width="0.16" height="0.2" depth="0.1" color="#3A3A36"></a-box>
        <a-box width="0.08" height="0.04" depth="0.08" position="0 0.12 0" color="#3A3A36"></a-box>
        <a-entity id="texto-basura" text="value: ; align: center; color: #fff; width: 3" position="0 0.3 0"></a-entity>
      </a-entity>
    </a-entity>

    <!-- LUCES -->
    <!-- Luz general (afuera). Con id para que el componente "portal" la baje dentro de las salas. -->
    <a-entity id="luz-ambiente" light="type: ambient; intensity: 0.9"></a-entity>
    <a-entity id="luz-sol" light="type: directional; intensity: 0.6" position="-1 2 1"></a-entity>
  </a-scene>
</body>
</html>
