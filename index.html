<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Norte Maps v5</title>

  <!-- Libreria A-Frame: convierte las etiquetas <a-...> en objetos 3D -->
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>

  <!-- DATOS DEL MAPA: puntos, calles y territorio de Norte Maps, tal como vienen de Google My Maps
       (longitud y latitud en grados). Quedan guardados en window.NORTE_MAPS.
       Este archivo debe cargarse ANTES de los componentes, que lo usan. -->
  <script src="activos/norte-maps-datos.js"></script>

  <style>
    /* Cartelito de ayuda abajo a la izquierda (es HTML normal, no esta dentro de la escena 3D) */
    #hud {
      position: fixed; left: 12px; bottom: 12px; z-index: 10; max-width: 340px;
      font: 13px/1.4 system-ui, sans-serif; color: #222;
      background: rgba(255, 255, 255, 0.85); padding: 8px 12px; border-radius: 6px;
      pointer-events: none;
    }
  </style>

  <script>
    // ============================================================
    // COMPONENTES PROPIOS
    // Un componente es un comportamiento que se le pega a un objeto
    // escribiendo su nombre como atributo (ej: radio-audio="...").
    // ============================================================

    // ---------- 0) utilidades de recoleccion ----------
    // Dos estados por cassette, guardados en localStorage (persisten en ESTE navegador,
    // sin servidor ni cuenta de usuario -- fuera del alcance del prototipo):
    //   "llevando"    -> ya lo sacaste del mapa, lo llevas en la mano, pero AUN NO cuenta
    //                    para el contador/mural/rack (podes seguir explorando y juntar mas).
    //   "recolectado" -> lo depositaste en la radio: ahi si cuenta, se revela su fragmento
    //                    del mural, y queda disponible para reproducir desde el rack.
    var TOTAL_FRAGMENTOS = (window.NORTE_MAPS.puntos || []).filter(function (p) { return p.fragmento; }).length;
    function estaRecolectado(id) { return localStorage.getItem('norte-maps-recolectado-' + id) === '1'; }
    function estaLlevando(id) { return localStorage.getItem('norte-maps-llevando-' + id) === '1'; }
    function marcarLlevando(id) {
      localStorage.setItem('norte-maps-llevando-' + id, '1');
      window.dispatchEvent(new CustomEvent('norte-maps:llevando-cambio'));
    }
    function contarLlevando() {
      return (window.NORTE_MAPS.puntos || []).filter(function (p) { return p.fragmento && estaLlevando(p.fragmento); }).length;
    }
    // Deposita TODO lo que se esta llevando (se usa al hacer clic en la radio).
    function depositarTodo() {
      var items = (window.NORTE_MAPS.puntos || []).filter(function (p) { return p.fragmento && estaLlevando(p.fragmento); });
      if (!items.length) return false;
      items.forEach(function (p) {
        localStorage.removeItem('norte-maps-llevando-' + p.fragmento);
        localStorage.setItem('norte-maps-recolectado-' + p.fragmento, '1');
      });
      window.dispatchEvent(new CustomEvent('norte-maps:llevando-cambio'));
      window.dispatchEvent(new CustomEvent('norte-maps:recoleccion'));
      return true;
    }
    function contarRecolectados() {
      return (window.NORTE_MAPS.puntos || []).filter(function (p) { return p.fragmento && estaRecolectado(p.fragmento); }).length;
    }
    // La radio es el aparato, no algo que se "encuentre": su propio relato esta
    // siempre disponible desde el principio (no hay que recolectarlo).
    if (!estaRecolectado('radio')) { localStorage.setItem('norte-maps-recolectado-radio', '1'); }

    function actualizarContador() {
      var el = document.getElementById('contador-recoleccion');
      if (el) el.textContent = '🎞️ ' + contarRecolectados() + ' / ' + TOTAL_FRAGMENTOS + ' relatos recolectados';
    }
    function actualizarMano() {
      var n = contarLlevando();
      var mano = document.getElementById('mano-cassettes');
      if (mano) mano.setAttribute('visible', n > 0);
      var texto = document.getElementById('texto-mano');
      if (texto) texto.setAttribute('text', 'value', n > 0 ? ('x' + n) : '');
    }
    // Solo un audio suena a la vez (pausa cualquier otro que estuviera sonando).
    function pausarOtrosAudios(exceptoId) {
      document.querySelectorAll('audio[id^="audio-"]').forEach(function (a) {
        if (a.id !== exceptoId && !a.paused) a.pause();
      });
    }
    // "Apagar" un cassette ya recolectado: en vez de desaparecer del mapa (dejaba un
    // hueco raro), se queda ahi pero en gris y sin poder clickearlo de nuevo -- el mapa
    // sigue "encendido" (todo visible, da contexto), solo el icono ya usado se nota apagado.
    function apagarColeccionable(el) {
      el.querySelectorAll('.clickable').forEach(function (hijo) {
        hijo.classList.remove('clickable');
        hijo.removeAttribute('material');
        hijo.setAttribute('color', '#9C9C94');
      });
    }
    // Reinicio completo del prototipo: borra todo lo recolectado/llevado y recarga.
    function reiniciarExperiencia() {
      if (!confirm('¿Reiniciar la experiencia? Se borra todo lo recolectado en este navegador.')) return;
      Object.keys(localStorage).filter(function (k) { return k.indexOf('norte-maps-') === 0; })
        .forEach(function (k) { localStorage.removeItem(k); });
      location.reload();
    }
    window.addEventListener('load', function () {
      var btn = document.getElementById('boton-reiniciar');
      if (btn) btn.addEventListener('click', reiniciarExperiencia);
    });
    // Cuando algo nuevo se vuelve clickeable DESPUES de la carga inicial (ej. un
    // cajon del rack que se desbloquea), hay que avisarle al raycaster -- no detecta
    // solo los cambios de clase (ver nota de [[raycaster-clickable]] en el vault).
    function refrescarRaycaster() {
      var ray = document.querySelector('a-scene') && document.querySelector('a-scene').components.raycaster;
      if (ray) ray.refreshObjects();
    }
    window.addEventListener('norte-maps:recoleccion', actualizarContador);
    window.addEventListener('norte-maps:recoleccion', refrescarRaycaster);
    window.addEventListener('norte-maps:llevando-cambio', actualizarMano);
    window.addEventListener('load', actualizarContador);
    window.addEventListener('load', actualizarMano);

    // ---------- 1) punto-audio ----------
    // Mecanica de "recoleccion": pasar el mouse por encima hace crecer LEVEMENTE el
    // objeto (y se mantiene mientras el cursor sigue encima); cada clic es un pulso
    // corto (baja de escala y vuelve), no un crecimiento acumulado. Al llegar al
    // numero de clics definido por punto (p.clics, segun el peso del audio), el
    // objeto se desprende y pasa a la mano del visitante (queda "llevando", no
    // "recolectado" todavia -- eso recien pasa al depositarlo en la radio).
    AFRAME.registerComponent('punto-audio', {
      schema: { src: { type: 'selector' }, clics: { type: 'number', default: 3 }, id: { type: 'string' } },
      init: function () {
        var el = this.el;
        var self = this;
        this.contador = 0;
        this.hovering = false;

        if (this.data.id && (estaRecolectado(this.data.id) || estaLlevando(this.data.id))) {
          apagarColeccionable(el);   // ya se saco antes: se queda ahi, pero apagado (gris, no clickeable)
          return;
        }
        // OJO: este componente se pega en un contenedor SIN geometria propia (ver [[raycaster-clickable]]
        // en el vault): la clase "clickable" tiene que ir en la geometria hija real (puesta por quien
        // crea el objeto), no aqui. Los eventos igual llegan aqui porque suben por el DOM (bubbling).

        function escalaBase() { return self.hovering ? 1.12 : 1; }

        el.addEventListener('mouseenter', function () {
          self.hovering = true;
          el.sceneEl.canvas.style.cursor = 'pointer';
          el.object3D.scale.setScalar(escalaBase());
        });
        el.addEventListener('mouseleave', function () {
          self.hovering = false;
          el.sceneEl.canvas.style.cursor = '';
          el.object3D.scale.setScalar(escalaBase());
        });
        el.addEventListener('click', function () {
          self.contador++;
          // pulso corto: baja de escala un instante y vuelve a la escala base (hover o normal)
          el.object3D.scale.setScalar(0.86);
          setTimeout(function () { el.object3D.scale.setScalar(escalaBase()); }, 90);

          if (self.contador >= self.data.clics && self.data.id) {
            marcarLlevando(self.data.id);
            apagarColeccionable(el);
          }
        });
      }
    });

    // ---------- 1b) portal ----------
    // Puerta clickeable que teletransporta la camara DENTRO DE LA MISMA ESCENA
    // (no carga otra pagina ni otro <a-scene>). Se usa para entrar/salir de los
    // interiores (CECOF, sala del gimnasio) sin romper la continuidad cartografica.
    AFRAME.registerComponent('portal', {
      schema: { destino: { type: 'vec3' }, mirara: { type: 'vec3' } },
      init: function () {
        var el = this.el, data = this.data;
        el.classList.add('clickable');
        el.addEventListener('click', function () {
          var cam = document.querySelector('[camera]');
          if (!cam) return;
          cam.object3D.position.set(data.destino.x, data.destino.y, data.destino.z);
          if (data.mirara) {
            var dx = data.mirara.x - data.destino.x, dz = data.mirara.z - data.destino.z;
            cam.components['look-controls'].yawObject.rotation.y = Math.atan2(-dx, -dz);
          }
        });
        el.addEventListener('mouseenter', function () { el.sceneEl.canvas.style.cursor = 'pointer'; });
        el.addEventListener('mouseleave', function () { el.sceneEl.canvas.style.cursor = ''; });
      }
    });

    // ---------- 2) mirar-camara ----------
    // Hace que un objeto (aqui, los carteles con nombre) gire siempre hacia quien mira,
    // pero solo de izquierda a derecha: el cartel queda vertical, no se inclina.
    AFRAME.registerComponent('mirar-camara', {
      init: function () {
        this.destino = new THREE.Vector3();   // donde esta la camara
      },
      tick: function () {
        var camara = this.el.sceneEl.camera;
        if (!camara) return;
        var obj = this.el.object3D;
        camara.getWorldPosition(this.destino);
        this.destino.y = obj.position.y;      // misma altura que el cartel -> no se inclina
        obj.lookAt(this.destino);
      }
    });

    // ---------- 3) correr ----------
    // Mantener Shift = caminar mas rapido (util para recorrer el mapa a escala real).
    // Funciona cambiando la "aceleracion" del componente wasd-controls.
    AFRAME.registerComponent('correr', {
      schema: { normal: { default: 15 }, rapido: { default: 60 } },
      init: function () {
        var el = this.el, d = this.data;
        function poner(valor) { el.setAttribute('wasd-controls', 'acceleration', valor); }
        window.addEventListener('keydown', function (e) { if (e.key === 'Shift') poner(d.rapido); });
        window.addEventListener('keyup', function (e) { if (e.key === 'Shift') poner(d.normal); });
        window.addEventListener('blur', function () { poner(d.normal); }); // si se pierde el foco, vuelve a normal
      }
    });

    // ---------- 4) norte-maps ----------
    // Construye el barrio a partir de los datos de window.NORTE_MAPS:
    //   - el suelo y el "territorio urbano" (el poligono del mapa)
    //   - las calles, como cintas sobre el suelo, con su nombre
    //   - los 12 puntos del mapa (gimnasio, radio, humedal...) con su cartel
    //   - los edificios en volumen: los reales (de OpenStreetMap) y casas de relleno inventadas
    //   - los puntos de reciclaje (cilindros chicos de colores)
    // El gimnasio queda en el centro del mundo (0, 0, 0).
    //
    // LA ESCALA: "escala: 0.2" significa 1 metro real = 0.2 metros en la escena (1:5).
    // Para ver el barrio a tamaño real hay dos formas:
    //   a) en la direccion del navegador agregar  ?escala=1   (ej: http://127.0.0.1:5500/index_v4.html?escala=1)
    //   b) en el HTML de mas abajo cambiar  norte-maps="escala: 0.2"  por  norte-maps="escala: 1"
    // Si hay ?escala= en la direccion, manda por sobre el numero escrito en el HTML.
    //
    // OTROS PARAMETROS DE LA DIRECCION (para probar sin editar el codigo):
    //   ?relleno=no   -> oculta las casas de relleno y deja solo los edificios reales de OpenStreetMap
    //   ?altura=2     -> exagera la altura de los edificios (2 = el doble). Util a escala 1:5, donde todo se ve bajito.
    AFRAME.registerComponent('norte-maps', {
      schema: { escala: { default: 0.2 } },

      init: function () {
        var el = this.el;
        var escena = el.sceneEl;
        var datos = window.NORTE_MAPS;
        if (!datos) { console.error('Falta activos/norte-maps-datos.js'); return; }

        // --- 1. Escala (del HTML, o de ?escala= en la direccion) ---
        var param = parseFloat(new URLSearchParams(location.search).get('escala'));
        var escala = param > 0 ? param : this.data.escala;
        this.escala = escala;
        var params = new URLSearchParams(location.search);
        var mostrarRelleno = params.get('relleno') !== 'no';
        var exagera = parseFloat(params.get('altura')) > 0 ? parseFloat(params.get('altura')) : 1;

        // --- 2. De grados (lon, lat) a metros de la escena ---
        // Un grado de latitud mide ~111 km (radio de la Tierra * pi/180).
        // Un grado de longitud mide menos cuanto mas lejos del ecuador: se multiplica por cos(latitud).
        // El origen (0,0) es el gimnasio. Este = +x. Norte = -z (en A-Frame "adelante" es -z).
        var RADIO_TIERRA = 6371000, RAD = Math.PI / 180;
        var origen = datos.origen, cosLat = Math.cos(origen.lat * RAD);
        function aEscena(lon, lat) {
          return new THREE.Vector2(
            (lon - origen.lon) * RAD * RADIO_TIERRA * cosLat * escala,   // x
            -(lat - origen.lat) * RAD * RADIO_TIERRA * escala             // z
          );
        }
        this.aEscena = aEscena;

        // --- 3. Ayudas ---
        // Crea un objeto de A-Frame (<a-...>) desde JavaScript y lo mete dentro de "padre".
        function crear(etiqueta, atributos, padre) {
          var e = document.createElement(etiqueta);
          for (var k in atributos) e.setAttribute(k, atributos[k]);
          (padre || el).appendChild(e);
          return e;
        }
        // Crea una malla 3D (geometria + material). "orden" decide quien se dibuja primero:
        // asi el suelo queda debajo del territorio y este debajo de las calles, sin parpadeos.
        function malla(geometria, color, orden) {
          var m = new THREE.Mesh(geometria, new THREE.MeshStandardMaterial({
            color: color, roughness: 1, side: THREE.DoubleSide, depthWrite: false
          }));
          m.renderOrder = orden;
          return m;
        }

        // --- 4. Niebla: mas cerca cuanto mas chico el mapa (con 0.2 es igual a la version anterior) ---
        escena.setAttribute('fog', 'type: linear; color: #ECECEC; near: ' + (125 * escala) + '; far: ' + (475 * escala));

        // --- 5. Suelo (un plano enorme) ---
        var lado = Math.max(500, 2600 * escala);
        var suelo = new THREE.PlaneGeometry(lado, lado);
        suelo.rotateX(-Math.PI / 2);                  // el plano nace vertical: se acuesta
        el.setObject3D('suelo', malla(suelo, '#E3DED0', -3));

        // --- 6. Territorio urbano: el poligono del mapa, de un verde claro ---
        // (se le quita el ultimo vertice porque repite el primero)
        var contorno = datos.territorio.slice(0, -1).map(function (p) {
          var q = aEscena(p[0], p[1]);
          return new THREE.Vector2(q.x, -q.y);        // ShapeGeometry usa (x, y); al acostarla, y pasa a ser -z
        });
        var territorio = new THREE.ShapeGeometry(new THREE.Shape(contorno));
        territorio.rotateX(-Math.PI / 2);
        el.setObject3D('territorio', malla(territorio, '#C2D9BC', -2));

        // --- 7. Calles: cada calle es una "cinta" (una tira) que sigue sus vertices ---
        var anchoCalle = 9 * escala;                  // ~9 m reales, en la escala elegida
        var pos = [], idx = [];                       // todas las calles se juntan en UNA sola malla (mas liviano)

        function agregarCinta(puntos, ancho) {
          var base = pos.length / 3;
          var n = puntos.length;
          for (var i = 0; i < n; i++) {
            // direccion del tramo anterior y del siguiente en este vertice
            var dPrev = i > 0 ? puntos[i].clone().sub(puntos[i - 1]).normalize() : null;
            var dSig = i < n - 1 ? puntos[i + 1].clone().sub(puntos[i]).normalize() : null;
            var dir = (dPrev && dSig) ? dPrev.clone().add(dSig).normalize() : (dPrev || dSig);
            var normal = new THREE.Vector2(-dir.y, dir.x);           // perpendicular a la direccion
            // en las esquinas se alarga un poco el borde para que la cinta no se "pince"
            var largo = ancho / 2;
            if (dPrev && dSig) {
              var nSeg = new THREE.Vector2(-dPrev.y, dPrev.x);
              largo = (ancho / 2) / Math.max(0.5, normal.dot(nSeg));
            }
            pos.push(puntos[i].x + normal.x * largo, 0, puntos[i].y + normal.y * largo);   // borde izquierdo
            pos.push(puntos[i].x - normal.x * largo, 0, puntos[i].y - normal.y * largo);   // borde derecho
          }
          for (var j = 0; j < n - 1; j++) {                          // cada tramo = 2 triangulos
            var a = base + j * 2;
            idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2);
          }
        }

        var etiquetasCalles = [];
        datos.calles.forEach(function (calle) {
          var puntos = calle.pts.map(function (p) { return aEscena(p[0], p[1]); });
          var esAvenida = calle.nombre.indexOf('Avenida') === 0;
          agregarCinta(puntos, esAvenida ? anchoCalle * 1.8 : anchoCalle);
          // buscamos el tramo mas largo para poner ahi el nombre
          var mejor = 0, mejorLargo = 0;
          for (var i = 0; i < puntos.length - 1; i++) {
            var L = puntos[i].distanceTo(puntos[i + 1]);
            if (L > mejorLargo) { mejorLargo = L; mejor = i; }
          }
          etiquetasCalles.push({ nombre: calle.nombre, a: puntos[mejor], b: puntos[mejor + 1], largo: mejorLargo });
        });

        var geoCalles = new THREE.BufferGeometry();
        geoCalles.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
        geoCalles.setIndex(idx);
        geoCalles.computeVertexNormals();
        el.setObject3D('calles', malla(geoCalles, '#7C7C78', -1));

        // --- 8. Nombres de las calles: texto acostado sobre el suelo, siguiendo la calle ---
        etiquetasCalles.forEach(function (c) {
          var dx = c.b.x - c.a.x, dz = c.b.y - c.a.y;
          // angulo de la calle visto desde arriba (al acostar el texto, su "arriba" apunta a -z)
          var angulo = Math.atan2(-dz, dx) * 180 / Math.PI;
          if (angulo > 90) angulo -= 180;             // para que el texto no quede "de cabeza"
          if (angulo < -90) angulo += 180;
          var ancho = Math.min(anchoCalle * 2.7, c.largo * 0.9);
          crear('a-entity', {
            text: 'value: ' + c.nombre + '; align: center; anchor: center; color: #F5F5F5; width: ' + ancho,
            position: ((c.a.x + c.b.x) / 2) + ' 0.05 ' + ((c.a.y + c.b.y) / 2),
            rotation: '-90 0 ' + angulo
          });
        });

        // --- 8b. Edificios en volumen ---
        // Cada edificio es un poligono (su contorno, en grados) que se "extruye": se levanta hasta su altura.
        // Todos se juntan en UNA sola malla. Cada edificio tiene:
        //   - un techo: el poligono dividido en triangulos (ShapeUtils.triangulateShape)
        //   - paredes: un rectangulo por cada lado del contorno
        // La altura en la escena = altura real * escala * exageracion (la de ?altura=).
        var posE = [], colE = [], idxE = [];
        var colorReal = new THREE.Color('#F6E7C8'), colorRelleno = new THREE.Color('#E6E2D8');
        var nReal = 0, nRelleno = 0;
        var colisionesEdificios = [];   // circulo (centro+radio) por edificio, para no poder atravesarlo caminando
        this.colisionesEdificios = colisionesEdificios;
        (datos.edificios || []).forEach(function (e, k) {
          if (!e.real && !mostrarRelleno) return;
          var contorno = e.pts.map(function (p) { return aEscena(p[0], p[1]); });
          var alto = e.alto * escala * exagera;
          // Colision SOLO contra edificios reales (OpenStreetMap). Las 500+ casas de relleno
          // son inventadas para dar densidad visual, estan muy juntas y a veces se superponen
          // entre si -- usarlas para colision generaba un "arrastre" raro de la camara (varios
          // circulos empujando en cadena). No son reales: no tiene sentido chocar contra ellas.
          if (e.real) {
            var cx = 0, cz = 0;
            contorno.forEach(function (p) { cx += p.x; cz += p.y; });
            cx /= contorno.length; cz /= contorno.length;
            var radioEdif = 0;
            contorno.forEach(function (p) { radioEdif = Math.max(radioEdif, Math.hypot(p.x - cx, p.y - cz)); });
            // Tope de 6 m reales: algun edificio real del dataset (OpenStreetMap, probablemente
            // una manzana completa u otro poligono irregular) daba un circulo de colision
            // gigante (~23 m de radio) que tapaba toda la zona del gimnasio/CECOF. Un circulo
            // de 6 m es de sobra para un edificio comun y evita esos casos raros.
            radioEdif = Math.min(radioEdif, 6 * escala);
            colisionesEdificios.push({ x: cx, z: cz, radio: radioEdif + 0.3 * escala });
          }
          // un poco de variacion de tono entre un edificio y otro (sin azar real: depende del numero de edificio)
          var techo = (e.real ? colorReal : colorRelleno).clone();
          techo.offsetHSL(0, 0, (((k * 37) % 11) / 11 - 0.5) * 0.06);
          var pared = techo.clone().multiplyScalar(0.9);
          if (e.real) nReal++; else nRelleno++;

          // techo
          var base = posE.length / 3;
          contorno.forEach(function (p) { posE.push(p.x, alto, p.y); colE.push(techo.r, techo.g, techo.b); });
          THREE.ShapeUtils.triangulateShape(contorno.slice(), []).forEach(function (t) {
            idxE.push(base + t[0], base + t[1], base + t[2]);
          });
          // paredes
          for (var i = 0; i < contorno.length; i++) {
            var a = contorno[i], b = contorno[(i + 1) % contorno.length];
            var v = posE.length / 3;
            posE.push(a.x, 0, a.y, b.x, 0, b.y, b.x, alto, b.y, a.x, alto, a.y);
            for (var c = 0; c < 4; c++) colE.push(pared.r, pared.g, pared.b);
            idxE.push(v, v + 1, v + 2, v, v + 2, v + 3);
          }
        });
        this.nReal = nReal;
        this.nRelleno = nRelleno;
        if (posE.length) {
          var geoE = new THREE.BufferGeometry();
          geoE.setAttribute('position', new THREE.Float32BufferAttribute(posE, 3));
          geoE.setAttribute('color', new THREE.Float32BufferAttribute(colE, 3));
          geoE.setIndex(idxE);
          // flatShading: cada cara se ilumina por separado (se ve "maqueta" y no hacen falta normales)
          el.setObject3D('edificios', new THREE.Mesh(geoE, new THREE.MeshStandardMaterial({
            vertexColors: true, flatShading: true, roughness: 1, side: THREE.DoubleSide
          })));
        }

        // --- 9. INTERIORES: el CECOF (con la radio adentro) y la sala del gimnasio (con el mural).
        // Se ubican lejos del barrio para no superponerse visualmente; se entra y sale por una
        // puerta clickeable (componente "portal") que mueve la camara DENTRO de la misma escena,
        // sin cambiar de pagina: la cartografia no se corta.
        var SALA_CECOF = new THREE.Vector3(300, 0, 0);
        var SALA_GIMNASIO = new THREE.Vector3(300, 0, 60);
        // Posicion de cada fragmento del mural dentro de la imagen completa (u,v de 0 a 1,
        // 0,0 = esquina superior izquierda de la foto real), para que el fragmento aparezca
        // en la sala EXACTAMENTE donde esta ese icono en el mural fisico.
        var FRAGMENTOS_UV = {
          gimnasio: [0.459, 0.568], radio: [0.415, 0.534], cecof: [0.421, 0.579],
          huerta: [0.376, 0.514], 'perritos-a': [0.370, 0.656], 'perritos-b': [0.567, 0.651],
          'comida-rapida': [0.591, 0.733], cancha: [0.629, 0.683], locomocion: [0.747, 0.616]
        };

        // OJO ESCALA: "ancho"/"alto" llegan ya en metros reales (sin multiplicar por "escala").
        // Esta funcion los escala ella misma -- asi construirCaja(8,4,...) siempre significa
        // "8x4 metros reales", sea cual sea la escala elegida (antes quedaban fijos y
        // desproporcionados en relacion al barrio achicado: el bug que hacia "ver raro el mapa").
        function construirCaja(anchoReal, altoReal, padre) {
          var ancho = anchoReal * escala, alto = altoReal * escala;
          var grosor = 0.15 * escala;
          crear('a-plane', { width: ancho, height: ancho, rotation: '-90 0 0', color: '#D8D2C2' }, padre);
          crear('a-box', { width: ancho, height: alto, depth: grosor, position: '0 ' + (alto / 2) + ' ' + (-ancho / 2), color: '#EDE9DD' }, padre);
          crear('a-box', { width: grosor, height: alto, depth: ancho, position: (-ancho / 2) + ' ' + (alto / 2) + ' 0', color: '#EDE9DD' }, padre);
          crear('a-box', { width: grosor, height: alto, depth: ancho, position: (ancho / 2) + ' ' + (alto / 2) + ' 0', color: '#EDE9DD' }, padre);
          crear('a-entity', { light: 'type: point; intensity: 0.7; distance: ' + (25 * escala) }, padre).setAttribute('position', '0 ' + (alto - 0.4 * escala) + ' 0');
          // se devuelve tambien "grosor": cualquier cosa que se cuelgue de una pared (mural,
          // pantalla, rack) tiene que quedar DELANTE de ella, no en su linea central -- si no,
          // queda dentro del espesor de la pared y la tapa el propio muro (invisible).
          return { ancho: ancho, alto: alto, grosor: grosor };
        }

        function construirSalaCecof(fueraQ, radioData) {
          var sala = crear('a-entity', { position: SALA_CECOF.x + ' ' + SALA_CECOF.y + ' ' + SALA_CECOF.z });
          var dim = construirCaja(8, 4, sala);   // 8x4 METROS REALES -- construirCaja aplica la escala

          // La radio: es el APARATO, no un cassette para recolectar. Su propio relato
          // esta siempre disponible. Un clic con las manos vacias lo reproduce/pausa;
          // un clic LLEVANDO cassettes los deposita a todos de una vez (quedan en el
          // rack de la pared, listos para reproducirse).
          if (radioData) {
            var marcaRadio = crear('a-entity', { position: '0 0 ' + (-1 * escala) }, sala);
            crear('a-box', { width: 0.6 * escala, height: 1 * escala, depth: 0.5 * escala, position: '0 ' + (0.5 * escala) + ' 0', color: '#9C7A54' }, marcaRadio);
            var modeloRadio = crear('a-entity', { 'gltf-model': '#radio', position: '0 ' + (1 * escala) + ' 0', scale: (2 * escala) + ' ' + (2 * escala) + ' ' + (2 * escala), class: 'clickable' }, marcaRadio);
            modeloRadio.addEventListener('mouseenter', function () { modeloRadio.sceneEl.canvas.style.cursor = 'pointer'; modeloRadio.object3D.scale.setScalar(2.2 * escala); });
            modeloRadio.addEventListener('mouseleave', function () { modeloRadio.sceneEl.canvas.style.cursor = ''; modeloRadio.object3D.scale.setScalar(2 * escala); });
            modeloRadio.addEventListener('click', function () {
              if (contarLlevando() > 0) { depositarTodo(); return; }
              var audioRadio = document.getElementById('audio-' + radioData.audio);
              if (!audioRadio) return;
              if (audioRadio.paused) { pausarOtrosAudios(audioRadio.id); audioRadio.play().catch(function (e) { console.warn(e); }); }
              else { audioRadio.pause(); }
            });
          }

          // El rack: EN LA PARED izquierda (no sobre una mesa), un cassette "ranura" por
          // cada relato que se encuentra afuera (todos menos la radio), con su nombre
          // debajo en letra chica. Gris y bloqueado hasta depositarlo; celeste y
          // clickeable despues -- clic para reproducir (pausa cualquier otro audio).
          var otrosFragmentos = datos.puntos.filter(function (p) { return p.fragmento && p.fragmento !== 'radio'; });
          var xPared = -dim.ancho / 2 + dim.grosor + 0.02 * escala;      // DELANTE de la pared izquierda (no dentro)
          var zBase = -1.3 * escala, pasoZ = 0.9 * escala, pasoY = -0.7 * escala, yBase = dim.alto * 0.62;
          otrosFragmentos.forEach(function (p, i) {
            var col = i % 4, fila = Math.floor(i / 4);
            var z = zBase + col * pasoZ, y = yBase + fila * pasoY;
            var ranura = crear('a-entity', { position: xPared + ' ' + y + ' ' + z, rotation: '0 90 0' }, sala);
            var caja = crear('a-box', { width: 0.1 * escala, height: 0.16 * escala, depth: 0.03 * escala, color: '#6B6B66' }, ranura);
            crear('a-entity', {
              text: 'value: ' + p.nombre + '; align: center; color: #555; width: ' + (1.6 * escala),
              position: '0 ' + (-0.13 * escala) + ' ' + (0.02 * escala)
            }, ranura);
            function refrescarRanura() {
              var listo = estaRecolectado(p.fragmento);
              caja.setAttribute('color', listo ? '#3B8FA8' : '#6B6B66');
              if (listo) caja.classList.add('clickable'); else caja.classList.remove('clickable');
            }
            refrescarRanura();
            caja.addEventListener('mouseenter', function () {
              if (!estaRecolectado(p.fragmento)) return;
              caja.sceneEl.canvas.style.cursor = 'pointer'; caja.object3D.scale.setScalar(1.18);
            });
            caja.addEventListener('mouseleave', function () { caja.object3D.scale.setScalar(1); caja.sceneEl.canvas.style.cursor = ''; });
            caja.addEventListener('click', function () {
              if (!estaRecolectado(p.fragmento)) return;
              var a = document.getElementById('audio-' + p.audio);
              if (!a) return;
              if (a.paused) { pausarOtrosAudios(a.id); a.currentTime = 0; a.play().catch(function (e) { console.warn(e); }); }
              else { a.pause(); }
            });
            window.addEventListener('norte-maps:recoleccion', refrescarRanura);
          });

          var puerta = crear('a-box', { width: 1 * escala, height: 2 * escala, depth: 0.1 * escala, position: '0 ' + escala + ' ' + (dim.ancho / 2 - 0.05 * escala), color: '#8C6A46' }, sala);
          // al volver afuera, la altura de ojo vuelve a ser la de la escala exterior (1.6*escala), no la real del interior
          puerta.setAttribute('portal', 'destino: ' + fueraQ.x + ' ' + (1.6 * escala) + ' ' + (fueraQ.y + 4 * escala) + '; mirara: ' + fueraQ.x + ' ' + (1.6 * escala) + ' ' + fueraQ.y);
        }

        function construirSalaGimnasio(fueraQ) {
          var sala = crear('a-entity', { position: SALA_GIMNASIO.x + ' ' + SALA_GIMNASIO.y + ' ' + SALA_GIMNASIO.z });
          var dim = construirCaja(9, 5, sala);   // 9x5 METROS REALES -- construirCaja aplica la escala
          // OJO: con el ancho real de la foto (1600x1066 px), un mural de 8 m de ancho da
          // 5.33 m de alto -- MAS ALTO que el techo de 5 m de esta sala (quedaba cortado
          // contra el techo). 6 m de ancho da 4 m de alto, con margen de sobra.
          var murWreal = 6, murW = murWreal * escala, murH = murW * 1066 / 1600;
          var zMural = -dim.ancho / 2 + dim.grosor + 0.02 * escala;   // DELANTE de la pared de atras (no dentro)
          crear('a-plane', {
            width: murW, height: murH, position: '0 ' + (murH / 2 + 0.3 * escala) + ' ' + zMural,
            material: 'src: #mural-completo; opacity: 0.18; shader: flat'
          }, sala);
          Object.keys(FRAGMENTOS_UV).forEach(function (clave) {
            var uv = FRAGMENTOS_UV[clave];
            var x = (uv[0] - 0.5) * murW;
            var y = (murH / 2 + 0.3 * escala) + (0.5 - uv[1]) * murH;
            var frag = crear('a-plane', {
              width: 1 * escala, height: 1 * escala, position: x + ' ' + y + ' ' + (zMural + 0.02 * escala),
              material: 'src: #frag-' + clave + '; shader: flat'
            }, sala);
            frag.setAttribute('visible', estaRecolectado(clave));
            frag.classList.add('fragmento-' + clave);
          });
          window.addEventListener('norte-maps:recoleccion', function () {
            Object.keys(FRAGMENTOS_UV).forEach(function (clave) {
              var frag = sala.querySelector('.fragmento-' + clave);
              if (frag) frag.setAttribute('visible', estaRecolectado(clave));
            });
          });

          // El "cine": pantalla + proyector en la pared lateral izquierda. Queda
          // bloqueada (gris, sin clic) hasta reunir los 9 relatos en el mural/rack;
          // al completarse, se desbloquea y un clic reproduce el documental (antes
          // esto era un boton flotante fuera de la escena -- ahora vive adentro, sin
          // texto explicativo: el color apagado/encendido ya comunica el estado).
          var xPared = -dim.ancho / 2 + dim.grosor + 0.02 * escala;   // DELANTE de la pared lateral (no dentro)
          var pantalla = crear('a-plane', {
            width: 2.6 * escala, height: 1.5 * escala, position: xPared + ' ' + (1.8 * escala) + ' ' + (dim.ancho * 0.3), rotation: '0 90 0', color: '#1A1A1A'
          }, sala);
          crear('a-box', { width: 0.3 * escala, height: 0.2 * escala, depth: 0.4 * escala, position: (-xPared) + ' ' + (2.6 * escala) + ' ' + (dim.ancho * 0.3), rotation: '0 90 0', color: '#444' }, sala);
          function refrescarPantalla() {
            var listo = contarRecolectados() === TOTAL_FRAGMENTOS;
            pantalla.setAttribute('color', listo ? '#000' : '#1A1A1A');
            if (listo) pantalla.classList.add('clickable'); else pantalla.classList.remove('clickable');
          }
          refrescarPantalla();
          pantalla.addEventListener('mouseenter', function () { if (contarRecolectados() === TOTAL_FRAGMENTOS) pantalla.sceneEl.canvas.style.cursor = 'pointer'; });
          pantalla.addEventListener('mouseleave', function () { pantalla.sceneEl.canvas.style.cursor = ''; });
          pantalla.addEventListener('click', function () {
            if (contarRecolectados() !== TOTAL_FRAGMENTOS) return;
            document.getElementById('iframe-documental').src = 'https://www.youtube.com/embed/S1ep6XOCqaQ?autoplay=1';
            document.getElementById('modal-documental').style.display = 'flex';
          });
          window.addEventListener('norte-maps:recoleccion', refrescarPantalla);

          var puerta = crear('a-box', { width: 1 * escala, height: 2 * escala, depth: 0.1 * escala, position: '0 ' + escala + ' ' + (dim.ancho / 2 - 0.05 * escala), color: '#8C6A46' }, sala);
          puerta.setAttribute('portal', 'destino: ' + fueraQ.x + ' ' + (1.6 * escala) + ' ' + (fueraQ.y + 6 * escala) + '; mirara: ' + fueraQ.x + ' ' + (1.6 * escala) + ' ' + fueraQ.y);
        }

        // --- 10. Los puntos del mapa exterior ---
        var camaraInicio = null;                       // donde parte el visitante (se calcula abajo)
        var radioData = datos.puntos.find(function (p) { return p.tipo === 'radio'; });
        var colisiones = [];   // circulos (centro+radio, en unidades de escena) contra los que choca la camara
        this.colisiones = colisiones;
        datos.puntos.forEach(function (p) {
          if (p.tipo === 'radio') return;   // la radio ya no va afuera: vive dentro del CECOF
          var q = aEscena(p.lon, p.lat);
          // CORRECCION DE TERRENO: el GPS de Google My Maps ubicaba el CECOF a ~21 m del
          // gimnasio: el usuario, que conoce el lugar, confirmo que en realidad estan en
          // la MISMA calle, el MISMO lado, a 4 m uno del otro. Se prioriza el dato real
          // por sobre el pin aproximado (igual que se hizo antes con "la radio esta
          // dentro del CECOF"): el CECOF se reubica pegado al gimnasio, a su izquierda
          // (si uno sale del gimnasio mirando a la calle, hacia +x: izquierda = -z = norte).
          if (p.nombre === 'cecof') { q = new THREE.Vector2(0, -4 * escala); }
          var marca = crear('a-entity', { position: q.x + ' 0 ' + q.y });
          var altoCartel = 3.4 * escala;
          var esCecof = p.nombre === 'cecof';
          var offCartel = { x: 0, z: 0 };   // si el cassette se desplaza (ver mas abajo), el cartel lo sigue

          if (p.tipo === 'gimnasio') {
            // el gimnasio: todavia no tenemos su contorno real, asi que el VOLUMEN DE REFERENCIA
            // es el palo+esfera roja (marca donde esta el edificio) y el circulo de colision
            // (mas abajo) representa el volumen real del edificio. La puerta va EN EL BORDE de
            // ese circulo -- entrando justo al volumen, como corresponde -- y el cassette queda
            // al costado de la puerta, apenas mas afuera (alcanzable sin atravesar el volumen).
            var puertaGimPos = { x: 2.5, z: 1.75 };                  // metros reales, desde el centro
            var radioGim = Math.hypot(puertaGimPos.x, puertaGimPos.z);  // el circulo pasa justo por la puerta
            var offGim = { x: (puertaGimPos.x + 1) * escala, z: (puertaGimPos.z + 1) * escala };  // al costado
            offCartel = offGim;
            var coleccionable = crear('a-entity', { position: offGim.x + ' 0 ' + offGim.z }, marca);
            crear('a-cylinder', { radius: 0.08 * escala, height: 4 * escala, position: '0 ' + (2 * escala) + ' 0', color: '#444444', 'segments-radial': 6, 'segments-height': 1 }, coleccionable);
            crear('a-sphere', {
              radius: 0.45 * escala, position: '0 ' + (4.2 * escala) + ' 0', color: '#C8553D', 'segments-width': 12, 'segments-height': 8,
              material: 'color: #C8553D; emissive: #C8553D; emissiveIntensity: 0.4',
              // la clase "clickable" va en la esfera (geometria real), no en "coleccionable" (vacio):
              // el raycaster de A-Frame solo intersecta geometria puesta DIRECTAMENTE en el elemento marcado.
              class: p.audio ? 'clickable' : ''
            }, coleccionable);
            altoCartel = 5.2 * escala;
            // La altura del ojo tambien se escala (1.6 m reales * escala): a escala reducida,
            // si la camara quedara a 1.6 unidades fijas, el visitante se sentiria "gigante"
            // frente al barrio en miniatura. A escala 1 esto no cambia nada (1.6*1 = 1.6).
            camaraInicio = new THREE.Vector3(q.x, 1.6 * escala, q.y + 32 * escala);
            if (p.audio) {
              coleccionable.setAttribute('punto-audio', 'clics: ' + (p.clics || 3) + '; id: ' + p.fragmento);
            }
            colisiones.push({ x: q.x, z: q.y, radio: radioGim * escala });
            // Sin panel/marco decorativo aparte (ese "volumen de otro color" no correspondia a
            // nada real) -- la puerta sola, puesta justo en el borde del circulo de colision.
            var puertaGim = crear('a-box', { width: 0.5 * escala, height: 1.3 * escala, depth: 0.1 * escala, position: (puertaGimPos.x * escala) + ' ' + (0.65 * escala) + ' ' + (puertaGimPos.z * escala), color: '#8C6A46', class: 'clickable' }, marca);
            // OJO ESCALA: el "+3" tiene que escalar igual que todo lo demas -- sin esto,
            // entrar por la puerta te teletransportaba a 15 m del centro de la sala (afuera
            // de sus paredes, que miden ~4.5 m de radio), por eso se sentia "roto".
            puertaGim.setAttribute('portal', 'destino: ' + SALA_GIMNASIO.x + ' ' + (1.6 * escala) + ' ' + (SALA_GIMNASIO.z + 3 * escala) + '; mirara: ' + SALA_GIMNASIO.x + ' ' + (1.6 * escala) + ' ' + SALA_GIMNASIO.z);
            construirSalaGimnasio(q);
          } else {
            // un punto cualquiera: palo + esfera de color, o cassette sobre mesita si tiene audio.
            // Igual que el gimnasio: el objeto coleccionable va en su PROPIA sub-entidad, separada
            // de la puerta (CECOF) para que esta ultima no desaparezca al recolectar el cassette.
            // El CECOF: el volumen de referencia es el circulo de colision del edificio (mas
            // abajo), con la puerta puesta justo en su borde -- igual criterio que el gimnasio.
            // El cassette del CECOF queda al costado de SU PUERTA (no "en la calle" ni "atras",
            // como se habia puesto antes -- correccion pedida).
            var puertaCecofPos = { x: 1.8, z: 1.15 };
            var radioCecof = Math.hypot(puertaCecofPos.x, puertaCecofPos.z);
            var offColeccionable = esCecof ? { x: (puertaCecofPos.x + 1) * escala, z: (puertaCecofPos.z + 1) * escala } : { x: 0, z: 0 };
            if (esCecof) offCartel = offColeccionable;
            var coleccionable = crear('a-entity', { position: offColeccionable.x + ' 0 ' + offColeccionable.z }, marca);
            if (p.audio) {
              // una mesita BAJA (0.22 m reales) con el cassette encima: antes media 0.5 m y quedaba
              // por encima de la linea de vista con la camara ya mas baja (altura de ojo = 1.6*escala).
              crear('a-box', { width: 0.4 * escala, height: 0.22 * escala, depth: 0.4 * escala, position: '0 ' + (0.11 * escala) + ' 0', color: '#9C7A54' }, coleccionable);
              var cassette = crear('a-entity', { position: '0 ' + (0.24 * escala) + ' 0' }, coleccionable);
              // la clase "clickable" va en la geometria del cassette (no en la mesita ni en "coleccionable")
              crear('a-box', { width: 0.18 * escala, height: 0.03 * escala, depth: 0.11 * escala, color: '#3B8FA8', class: 'clickable' }, cassette);
              crear('a-cylinder', { radius: 0.028 * escala, height: 0.034 * escala, position: (-0.045 * escala) + ' ' + (0.02 * escala) + ' 0', color: '#222', 'segments-radial': 10, class: 'clickable' }, cassette);
              crear('a-cylinder', { radius: 0.028 * escala, height: 0.034 * escala, position: (0.045 * escala) + ' ' + (0.02 * escala) + ' 0', color: '#222', 'segments-radial': 10, class: 'clickable' }, cassette);
              altoCartel = 0.65 * escala;   // el cartel ahora va justo sobre la mesita baja
            } else {
              crear('a-cylinder', { radius: 0.06 * escala, height: 2.4 * escala, position: '0 ' + (1.2 * escala) + ' 0', color: '#444444', 'segments-radial': 6, 'segments-height': 1 }, coleccionable);
              crear('a-sphere', {
                radius: 0.28 * escala, position: '0 ' + (2.5 * escala) + ' 0', color: '#E8743B', 'segments-width': 12, 'segments-height': 8,
                material: 'color: #E8743B; emissive: #E8743B; emissiveIntensity: 0.4'
              }, coleccionable);
            }
            if (p.audio) {
              coleccionable.setAttribute('punto-audio', 'clics: ' + (p.clics || 3) + '; id: ' + p.fragmento);
            }
            if (esCecof) {
              // el CECOF es un edificio con interior: adentro esta la radio. Puerta mirando
              // a la misma calle que la del gimnasio (eje +x), como confirmo el usuario.
              // Sin panel/marco decorativo aparte -- el circulo de colision ES el volumen del
              // edificio, y la puerta va justo en su borde.
              colisiones.push({ x: q.x, z: q.y, radio: radioCecof * escala });
              var puertaCecof = crear('a-box', { width: 0.5 * escala, height: 1.3 * escala, depth: 0.1 * escala, position: (puertaCecofPos.x * escala) + ' ' + (0.65 * escala) + ' ' + (puertaCecofPos.z * escala), color: '#8C6A46', class: 'clickable' }, marca);
              // mismo fix que la puerta del gimnasio: el "+3" tiene que escalar.
              puertaCecof.setAttribute('portal', 'destino: ' + SALA_CECOF.x + ' ' + (1.6 * escala) + ' ' + (SALA_CECOF.z + 3 * escala) + '; mirara: ' + SALA_CECOF.x + ' ' + (1.6 * escala) + ' ' + SALA_CECOF.z);
              construirSalaCecof(q, radioData);
            }
          }

          // cartel con el nombre (siempre mirando al visitante, sin instrucciones -- el
          // hover/pulso ya comunica que se puede interactuar). Sigue al cassette si este
          // se desplazo (gimnasio/CECOF, ver offCartel mas arriba).
          crear('a-entity', {
            text: 'value: ' + p.nombre + '; align: center; anchor: center; color: #222222; width: ' + (8 * escala),
            position: offCartel.x + ' ' + altoCartel + ' ' + offCartel.z,
            'mirar-camara': ''
          }, marca);
        });

        // Union de los dos tipos de colision (edificios reales/relleno + gimnasio/CECOF):
        // se usan en tick() para que caminar en linea recta no atraviese los volumenes.
        this.colisiones = colisiones.concat(colisionesEdificios);

        // --- 10. Puntos de reciclaje: cilindros chicos de color ---
        var colores = { naturaleza: '#4E9F5B', basural: '#7A7A7A', rocura: '#3B8FA8' };
        datos.reciclaje.forEach(function (r) {
          var q = aEscena(r.lon, r.lat);
          crear('a-cylinder', {
            radius: 0.25 * escala, height: 0.5 * escala, position: q.x + ' ' + (0.25 * escala) + ' ' + q.y, color: colores[r.tipo] || '#999999', 'segments-radial': 10, 'segments-height': 1
          });
        });

        // --- 10b. Minimapa: vista cenital fija del barrio, para ubicarse en contexto ---
        // Proyecta territorio/calles/puntos a coordenadas 2D (reusando aEscena) y los
        // dibuja en un <canvas> aparte de la escena 3D; en cada tick se vuelve a dibujar
        // la posicion/orientacion del visitante encima.
        var canvasMini = document.getElementById('minimapa');
        if (canvasMini) {
          var ctxMini = canvasMini.getContext('2d');
          var terrMini = datos.territorio.map(function (p) { return aEscena(p[0], p[1]); });
          var callesMini = datos.calles.map(function (c) { return c.pts.map(function (p) { return aEscena(p[0], p[1]); }); });
          var puntosMini = datos.puntos.filter(function (p) { return p.tipo !== 'radio'; }).map(function (p) {
            var q = aEscena(p.lon, p.lat); return { x: q.x, y: q.y, audio: !!p.audio };
          });
          var minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
          terrMini.forEach(function (p) { minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x); minY = Math.min(minY, p.y); maxY = Math.max(maxY, p.y); });
          var margenMini = (maxX - minX) * 0.08;
          minX -= margenMini; maxX += margenMini; minY -= margenMini; maxY += margenMini;
          var W = canvasMini.width, H = canvasMini.height;
          var escalaMini = Math.min(W / (maxX - minX), H / (maxY - minY));
          function proyMini(x, y) { return { x: (x - minX) * escalaMini, y: (y - minY) * escalaMini }; }
          this.dibujarMinimapa = function () {
            ctxMini.clearRect(0, 0, W, H);
            ctxMini.beginPath();
            terrMini.forEach(function (p, i) { var q = proyMini(p.x, p.y); if (i === 0) ctxMini.moveTo(q.x, q.y); else ctxMini.lineTo(q.x, q.y); });
            ctxMini.closePath();
            ctxMini.fillStyle = '#C2D9BC'; ctxMini.fill();
            ctxMini.strokeStyle = '#9C9C94'; ctxMini.lineWidth = 1.2;
            callesMini.forEach(function (c) {
              ctxMini.beginPath();
              c.forEach(function (p, i) { var q = proyMini(p.x, p.y); if (i === 0) ctxMini.moveTo(q.x, q.y); else ctxMini.lineTo(q.x, q.y); });
              ctxMini.stroke();
            });
            puntosMini.forEach(function (p) {
              var q = proyMini(p.x, p.y);
              ctxMini.beginPath(); ctxMini.fillStyle = p.audio ? '#3B8FA8' : '#E8743B';
              ctxMini.arc(q.x, q.y, 2.3, 0, Math.PI * 2); ctxMini.fill();
            });
            var cam = document.querySelector('[camera]');
            if (cam) {
              var pos = cam.object3D.position;
              var q = proyMini(pos.x, pos.z);
              var yaw = cam.components['look-controls'] ? cam.components['look-controls'].yawObject.rotation.y : 0;
              ctxMini.save();
              ctxMini.translate(q.x, q.y); ctxMini.rotate(-yaw);
              ctxMini.fillStyle = '#C8553D';
              ctxMini.beginPath(); ctxMini.moveTo(0, -5); ctxMini.lineTo(3.5, 4); ctxMini.lineTo(-3.5, 4); ctxMini.closePath();
              ctxMini.fill();
              ctxMini.restore();
            }
          };
          this.dibujarMinimapa();
        }

        // --- 11. Camara: empieza junto al gimnasio, mirando hacia el centro del barrio ---
        var self = this;
        function ubicarVisitante() {
          var cam = document.querySelector('[camera]');
          if (!cam || !camaraInicio) return;
          cam.object3D.position.copy(camaraInicio);
          var yaw = Math.atan2(-(0 - camaraInicio.x), -(0 - camaraInicio.z));
          cam.components['look-controls'].yawObject.rotation.y = yaw;
          self.camara = cam;
        }
        if (escena.hasLoaded) ubicarVisitante(); else escena.addEventListener('loaded', ubicarVisitante);

        // --- 12. Cartelito de ayuda ---
        this.hud = document.getElementById('hud');
        this.contador = 0;
        this.escribirHud(null);
      },

      // Texto del cartelito: escala, distancia real al gimnasio y teclas.
      escribirHud: function (distanciaEscena) {
        if (!this.hud) return;
        var esc = this.escala;
        var linea1 = 'Norte Maps · escala 1:' + (1 / esc).toFixed(esc >= 0.95 ? 0 : 1).replace(/\.0$/, '') + ' (1 m real = ' + esc + ' m aqui)';
        var linea2 = distanciaEscena === null ? '' : '<br>Estas a ' + Math.round(distanciaEscena / esc) + ' m reales del gimnasio';
        this.hud.innerHTML = linea1 + linea2 +
          '<br>W A S D caminar · Shift correr · arrastrar el mouse para mirar' +
          '<br>Otra escala: agregar <b>?escala=1</b> a la direccion' +
          '<br><small>Edificios: ' + this.nReal + ' reales (© colaboradores de OpenStreetMap) + ' + this.nRelleno + ' casas de relleno inventadas (<b>?relleno=no</b> las oculta)</small>';
      },

      // Colision simple: cada edificio/volumen se aproxima a un circulo (centro+radio).
      // Si la camara quedo adentro de alguno (caminando en linea recta la atravesaria),
      // se la empuja hacia afuera por el borde mas cercano. Corre TODOS los cuadros
      // (tiene que ser inmediato); el HUD/minimapa, mas caros, corren cada 15 cuadros.
      resolverColisiones: function () {
        if (!this.colisiones || !this.colisiones.length) return;
        var p = this.camara.object3D.position;
        // OJO ESTABILIDAD: resolver TODOS los circulos superpuestos en el mismo cuadro, uno
        // atras de otro, puede "lanzar" la camara lejos si hay edificios muy juntos (cada
        // empuje puede dejarla adentro del siguiente circulo, y asi se suman desplazamientos
        // grandes en un solo cuadro). Por eso se resuelve SOLO el circulo con mayor penetracion
        // por cuadro: si hay varios superpuestos, se arreglan de a uno en los cuadros siguientes
        // (90 por segundo, es instantaneo igual para quien camina).
        var peor = null, peorPenetracion = 0;
        for (var i = 0; i < this.colisiones.length; i++) {
          var c = this.colisiones[i];
          var dist = Math.hypot(p.x - c.x, p.z - c.z);
          var penetracion = c.radio - dist;
          if (penetracion > peorPenetracion) { peorPenetracion = penetracion; peor = c; }
        }
        if (peor) {
          var dx = p.x - peor.x, dz = p.z - peor.z;
          var dist = Math.hypot(dx, dz);
          if (dist > 0.0001) {
            var k = peor.radio / dist;
            p.x = peor.x + dx * k;
            p.z = peor.z + dz * k;
          } else {
            p.x = peor.x + peor.radio;   // justo en el centro (caso raro): empuja en una direccion fija
          }
        }
      },

      // Cada ~15 cuadros actualizamos la distancia al gimnasio y el minimapa
      // (no hace falta redibujar en cada cuadro); la colision, en cambio, se revisa siempre.
      tick: function () {
        if (!this.camara) return;
        this.resolverColisiones();
        this.contador++;
        if (this.contador % 15) return;
        var p = this.camara.object3D.position;
        this.escribirHud(Math.sqrt(p.x * p.x + p.z * p.z));
        if (this.dibujarMinimapa) this.dibujarMinimapa();
      }
    });
  </script>
</head>

<body>
  <div id="hud"></div>

  <!-- Minimapa: vista cenital fija del barrio (calles, territorio, puntos) con la
       posicion y orientacion del visitante, para ubicarse en contexto mientras se
       camina. Lo dibuja el componente norte-maps (ver funcion "dibujarMinimapa"). -->
  <!-- top:56px: justo debajo del contador de relatos (que ocupa la esquina superior
       derecha), para no toparse ni con ese contador ni con el boton del documental
       (que esta abajo a la derecha). -->
  <canvas id="minimapa" width="150" height="150"
    style="position:fixed; right:12px; top:56px; z-index:10; border-radius:8px; opacity:0.6;
           border:1px solid rgba(0,0,0,0.2); background:transparent;"></canvas>

  <!-- Contador de recoleccion: cuantos "cassettes" ya se sacaron del mapa.
       Se actualiza solo (evento norte-maps:recoleccion) cada vez que recolectas uno.
       Va arriba a la DERECHA (no arriba a la izquierda) para no toparse con el panel
       de estadisticas de A-Frame (stats="fps/triangulos"), que ocupa esa esquina. -->
  <div id="contador-recoleccion"
    style="position:fixed; right:12px; top:12px; z-index:10; font:13px system-ui, sans-serif;
           padding:6px 12px; border-radius:6px; background:rgba(255,255,255,0.85); color:#222;"></div>

  <!-- Reiniciar: borra lo recolectado en ESTE navegador y recarga (no habia forma de
       volver a empezar sin abrir la consola). Pide confirmacion antes de borrar. -->
  <button id="boton-reiniciar"
    style="position:fixed; left:12px; top:12px; z-index:10; font:12px system-ui, sans-serif;
           padding:5px 10px; border-radius:6px; border:0; background:rgba(0,0,0,0.55); color:#fff; cursor:pointer;">
    ⟲ Reiniciar
  </button>

  <!-- El documental (video externo embebido via YouTube, no alojado aqui: el original
       pesa ~2GB) ya NO se abre con un boton flotante: ahora se reproduce desde la
       pantalla/proyector dentro de la sala del gimnasio, y solo se desbloquea al
       completar los 9 relatos (ver "construirSalaGimnasio" en el script). Esta caja
       de modal + iframe se mantiene, solo cambio quien la dispara. -->
  <div id="modal-documental"
    style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:20;
           align-items:center; justify-content:center;">
    <div style="position:relative; width:90%; max-width:800px; aspect-ratio:16/9;">
      <iframe id="iframe-documental" src="" title="Documental Norte Maps"
        style="width:100%; height:100%; border:0;" allow="autoplay; encrypted-media" allowfullscreen></iframe>
      <button id="cerrar-documental"
        style="position:absolute; top:-36px; right:0; font:13px system-ui, sans-serif;
               padding:4px 10px; border-radius:4px; border:0; background:#fff; cursor:pointer;">Cerrar ✕</button>
    </div>
  </div>

  <script>
    document.getElementById('cerrar-documental').addEventListener('click', function () {
      document.getElementById('modal-documental').style.display = 'none';
      document.getElementById('iframe-documental').src = '';
    });
  </script>

  <!-- ESCENA
       stats                            -> panel de rendimiento (fps, triangulos)
       background                       -> color de fondo (en vez de un cielo, que pesa mas)
       cursor="rayOrigin: mouse"        -> el mouse es el puntero que activa los objetos
       raycaster="objects: .clickable"  -> solo reaccionan los objetos con class="clickable"
       (la niebla la pone el componente norte-maps segun la escala) -->
  <a-scene stats background="color: #ECECEC" cursor="rayOrigin: mouse" raycaster="objects: .clickable">

    <!-- ARCHIVOS QUE SE CARGAN (modelo 3D de la radio y los relatos en audio) -->
    <a-assets>
      <a-asset-item id="radio" src="activos/radio.glb"></a-asset-item>
      <!-- Relatos reales grabados por la Cooperativa (mismos audios publicados en su Spotify) -->
      <audio id="audio-gimnasio" src="activos/gimnasio.mp3" preload="auto"></audio>
      <audio id="audio-radio" src="activos/radio.mp3" preload="auto"></audio>
      <audio id="audio-cecof" src="activos/cecof.mp3" preload="auto"></audio>
      <audio id="audio-comida-rapida" src="activos/comida-rapida.mp3" preload="auto"></audio>
      <audio id="audio-perritos" src="activos/perritos.mp3" preload="auto"></audio>
      <audio id="audio-cancha" src="activos/cancha.mp3" preload="auto"></audio>
      <audio id="audio-locomocion" src="activos/locomocion.mp3" preload="auto"></audio>
      <audio id="audio-huerta" src="activos/huerta.mp3" preload="auto"></audio>
      <!-- Foto real del mural pintado en el gimnasio y sus 9 fragmentos recortados
           (uno por cada relato recolectable), usados en la sala del gimnasio. -->
      <img id="mural-completo" src="activos/mural/mural-completo.jpg">
      <img id="frag-gimnasio" src="activos/mural/gimnasio.jpg">
      <img id="frag-radio" src="activos/mural/radio.jpg">
      <img id="frag-cecof" src="activos/mural/cecof.jpg">
      <img id="frag-huerta" src="activos/mural/huerta.jpg">
      <img id="frag-perritos-a" src="activos/mural/perritos-a.jpg">
      <img id="frag-perritos-b" src="activos/mural/perritos-b.jpg">
      <img id="frag-comida-rapida" src="activos/mural/comida-rapida.jpg">
      <img id="frag-cancha" src="activos/mural/cancha.jpg">
      <img id="frag-locomocion" src="activos/mural/locomocion.jpg">
    </a-assets>

    <!-- EL BARRIO, a escala reducida (1:5) para que el recorrido completo sea comodo.
         La sensacion de "gigante" de antes no era por la escala del mapa, sino porque
         la altura de la camara se quedaba fija en 1.6 m reales: ahora la altura del ojo
         tambien se achica con la escala (ver "camaraInicio" mas abajo en el codigo).
         Para probar a tamaño real: escala: 1, o agregar ?escala=1 en la direccion. -->
    <a-entity id="mapa" norte-maps="escala: 0.2"></a-entity>

    <!-- CAMARA: es el "ojo" del visitante. Su posicion inicial la calcula norte-maps (junto al gimnasio).
         near: 0.1 -> lo mas cercano que se dibuja; mejora la nitidez del suelo a lo lejos.
         correr    -> con Shift camina mas rapido -->
    <a-entity camera="fov: 60; near: 0.1" look-controls wasd-controls="acceleration: 15" correr
              position="0 1.6 5">
      <!-- Lo que llevas en la mano: aparece cuando recolectas un cassette del mapa y
           hasta que lo depositas en la radio (ver marcarLlevando/depositarTodo en el
           script). Es hijo de la camara, asi que se mueve y gira con la vista. -->
      <a-entity id="mano-cassettes" visible="false" position="0.45 -0.32 -0.9" scale="0.35 0.35 0.35">
        <a-box width="0.18" height="0.03" depth="0.11" color="#3B8FA8"></a-box>
        <a-cylinder radius="0.028" height="0.034" position="-0.045 0.02 0" color="#222" segments-radial="10"></a-cylinder>
        <a-cylinder radius="0.028" height="0.034" position="0.045 0.02 0" color="#222" segments-radial="10"></a-cylinder>
        <a-entity id="texto-mano" text="value: ; align: center; color: #fff; width: 3" position="0 0.12 0"></a-entity>
      </a-entity>
    </a-entity>

    <!-- LUCES -->
    <a-entity light="type: ambient; intensity: 0.9"></a-entity>
    <a-entity light="type: directional; intensity: 0.6" position="-1 2 1"></a-entity>
  </a-scene>
</body>
</html>
